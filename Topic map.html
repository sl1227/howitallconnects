<title>Topic map</title>
<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
h1{font-size:1.1rem;margin:0;flex:1;min-width:140px}
button{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{flex:1;min-height:0;display:flex}
#stage{flex:1;min-width:0;position:relative}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.drag{cursor:grabbing}
.node{cursor:pointer}
.node text{fill:var(--ink);font-size:11px;pointer-events:none;stroke:none}
.node circle{stroke:var(--panel);stroke-width:1.5}
.link.dim{opacity:.06}
#q{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;width:150px}
.node.sel circle{stroke:var(--ink);stroke-width:3}
.glabel{fill:var(--ink);font-size:20px;font-weight:700;opacity:.6;text-anchor:middle;pointer-events:none}
.link{fill:none;stroke:var(--link);stroke-width:1.5;opacity:.45}
.link.on{stroke:var(--accent);stroke-width:2.5;opacity:1}
.dim{opacity:.25}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;padding:0;font-size:1.1rem}
aside{width:300px;border-left:1px solid var(--line);background:var(--panel);padding:16px;overflow-y:auto}
aside h2{margin:0 0 4px;font-size:1.2rem}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-size:.8rem;margin-bottom:8px}
.muted{color:var(--muted)}
aside .rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
dialog{width:min(640px,94vw);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
textarea{width:100%;height:50vh;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
#err{color:#d33;min-height:1.4em;margin:6px 0}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:700px){.wrap{flex-direction:column}aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:38%}}

.node text{opacity:0;transition:opacity .15s}
.node.hub text,.node.rel text,.node.sel text,.zoomed .node text{opacity:1}
.node circle{stroke-width:1}
.node.sel circle{stroke-width:1.6}
.node circle.hit{fill:transparent!important;stroke:none!important}
.node text{font-size:10px}
.link{stroke-width:1;opacity:.2}
.glabel{pointer-events:auto;cursor:pointer;opacity:.8;font-size:19px;font-weight:600;letter-spacing:.2px}
.glabel:hover{opacity:1;text-decoration:underline}
aside{width:340px;line-height:1.65}
aside p{margin:8px 0}
aside h2{font-size:1.3rem}
header{box-shadow:0 1px 0 var(--line)}
aside .rel.why{flex-direction:column;gap:10px}
aside .rel.why small{display:block;margin:3px 0 0 4px;font-size:.78rem;line-height:1.45;color:var(--muted,#777)}
</style>
</head>
<body>
<header>
  <h1 id="title">Topic map</h1>
  <input id="q" type="search" placeholder="Find, then Enter" aria-label="Find an item">
  <button id="edit" class="primary">Edit topics</button>
</header>
<div class="wrap">
  <div id="stage">
    <svg id="svg" role="img" aria-label="Interactive topic map"><g id="g"></g></svg>
    <div class="zoom">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">&minus;</button>
      <button id="zfit" aria-label="Fit to screen">Fit</button>
    </div>
  </div>
  <aside id="panel"><p class="muted">Select a topic to read about it, or click a cluster name to explore the whole group. Drag to pan; scroll to zoom.</p></aside>
</div>

<dialog id="dlg">
  <h2 style="margin-top:0">Edit your topics</h2>
  <p class="muted" style="margin-top:0">Groups are the coloured clusters. Each item needs an id, name and group; add a desc to explain it and an optional <b>when</b> year. Links connect item ids.</p>
  <textarea id="json" spellcheck="false" aria-label="Topic data as JSON"></textarea>
  <div id="err" role="alert"></div>
  <div class="actions">
    <button id="reset">Reset to sample</button>
    <button id="cancel">Cancel</button>
    <button id="apply" class="primary">Apply</button>
  </div>
</dialog>

const LONG = {
bau:"Founded by Walter Gropius in Weimar in 1919, the Bauhaus taught art, craft and design together in workshops, aiming at a new unity of the arts. Its glass-and-steel, 'form follows function' look became the template for modern buildings, homewares and graphic design, and its teaching model still shapes cross-disciplinary education.",
eiffel:"Built for the 1889 Paris World's Fair, the tower showed that an engineer's iron lattice could be a landmark and a work of art. It advertised French industrial and colonial strength, gave people their first view of the city from above, and became the symbol of the machine age's confidence.",
conc:"Pierre Schaeffer's studio in Paris (1948, later the GRM) made music by recording everyday sounds, such as trains, then cutting, looping and reversing them on disc and tape. It treated sound itself as material, the 'top-down' route to electronic music, in contrast with building sound up from oscillators.",
reduct:"Reductionism explains wholes by their parts: take the engine apart and study each piece. It drove enormous success in physics and chemistry, but critics argue it struggles with systems whose behaviour emerges from relationships, such as ecosystems, minds and weather.",
vitru:"Vitruvius, a Roman architect, wrote that a well-built temple should match the proportions of a well-formed man. Leonardo's c.1490 drawing made this the icon of Renaissance humanism, with the human body as the measure of ideal order and beauty.",
silk:"The Silk Road was a web of overland and sea routes linking China, Central Asia, India, Persia and the Mediterranean. Silk mattered, but so did religions, technologies, languages and diseases; some historians describe it as an early information network.",
paper:"Chinese records credit court official Cai Lun with improving papermaking around 105 CE, though archaeological finds show paper existed earlier. Paper was cheaper and lighter than bamboo strips or silk, so it spread literacy, bureaucracy and, eventually, drawing and sketching.",
lum:"The Lumière brothers ran a photographic-plate factory in Lyon and projected their first films to a paying public in Paris in December 1895. Their short 'actualities', such as workers leaving the factory or a train arriving, helped define cinema; the story that audiences fled the train is likely folklore.",
pyth:"Greek tradition credits Pythagoras with discovering that simple string-length ratios (2:1, 3:2) give pleasing intervals, linking number and music. Whether he did it himself is uncertain, but the idea that harmony is mathematical shaped cosmology, tuning and architecture for centuries.",
equal:"Equal temperament divides the octave into twelve identical steps so any key works on a keyboard. It is a compromise: the pure ratios of the circle of fifths never quite close, so every interval except the octave is slightly off. It became standard in Western music over roughly the 18th and 19th centuries.",
jenny:"Swiss physician and artist Hans Jenny (1960s) vibrated sand, powders and fluids and filmed the patterns, naming the field cymatics. His images are striking and real, but his broader claims linking them to biology and cosmology are speculative.",
rev:"After the 1917 Revolution, Russian Constructivists such as Tatlin, Rodchenko and Lissitzky wanted artists to become 'engineers' building the new society. They worked in graphic design, photomontage, posters and architecture, and their ideas fed directly into the Bauhaus.",
speer:"Albert Speer, Hitler's architect, designed monumental neoclassical buildings and the Nuremberg rally settings. Their scale and stone columns were meant to project permanence and power, an example of how classical forms get recruited by authoritarian states.",
tape:"Magnetic tape (from the mid-1930s, widespread after WWII) let composers record, cut, splice, reverse and loop sound. Composers compared the method to cubist collage, and it underpins sampling and nearly all modern studio production.",
moog:"Robert Moog's voltage-controlled synthesisers (mid-1960s) added a keyboard to modular oscillators and filters, making synthesis playable. Patches had to be rebuilt by hand each time until digital presets arrived.",
qft:"In quantum field theory, particles are excitations of underlying fields rather than tiny solid balls. It fits experiments extremely well, but outcomes are probabilistic, which is why the Lego-brick picture of matter is a simplification.",
newton:"Newton's laws (1687) described motion and gravity with precise mathematics, inspiring the image of the universe as a predictable clockwork. Later physics kept the maths as a good approximation but dropped the claim that everything is strictly deterministic.",
chart:"Often called the Great Chain of Being, this scheme arranged nature in a ladder from minerals up through plants and animals to humans and angels. It encouraged seeing humans as superior to nature and some humans as superior to others.",
histhist:"Historiography asks who writes history and why. Accounts shaped by political economy, confirmation bias and Eurocentric framing can leave out exchange between cultures, so students are encouraged to check whose story is being told.",
sidd:"Siddhartha Gautama, a prince according to tradition, left his palace after seeing old age, sickness, death and a wandering ascetic. After years of extreme austerity he chose a middle path and, at Bodh Gaya, resisted Mara and became the Buddha, 'the awakened one'.",
lorenz:"Edward Lorenz found in 1963 that tiny differences in starting conditions could produce wildly different weather simulations. Chaos theory shows that deterministic systems can still be unpredictable in practice, challenging the clockwork ideal.",
biom:"Biomimicry, popularised by Janine Benyus in 1997, designs by studying how living things solve problems, from burr-inspired Velcro to termite-mound cooling. It is now a mainstream approach in architecture, product and graphic design.",
ai:"Artificial intelligence applies algorithms and data to tasks like recognising images and writing text. Critics see it as an extension of industrial thinking, optimising and automating by breaking problems into parts.",
photo:"Early photographs such as daguerreotypes needed exposures of many seconds, so sitters held still, a main reason portraits look stern. As exposure times fell, photography became a quick, everyday way to record the world.",
muy:"Eadweard Muybridge used lines of cameras in 1878 to show a galloping horse with all hooves off the ground. Étienne-Jules Marey developed a single camera to capture motion, and both treated the camera as a precise scientific eye.",
stockh:"Karlheinz Stockhausen's Studie II (1954) was built entirely from sine tones mixed according to a numerical score. It expressed the dream of controlling every parameter of sound, in contrast with the chance-driven approach of John Cage.",
kraft:"Kraftwerk in Düsseldorf and Giorgio Moroder in Munich used synthesisers and sequencers to make pop music with a machine pulse. Moroder's 'I Feel Love' (1977) and Kraftwerk's records helped define electronic dance and synth-pop.",
glassbox:"The 1932 MoMA show 'The International Style' named the clean, unornamented steel-and-glass look that spread worldwide after WWII. Critics say it ignores local climate and culture.",
fut:"Marinetti's 1909 manifesto celebrated speed, machines and violence and called for destroying museums. Futurism energised modern art, but its glorification of war and its links to Italian fascism complicated its legacy.",
prop:"Joseph Goebbels, Nazi propaganda minister, is commonly credited with the idea that a lie repeated often enough is accepted as truth. The Situationists likewise analysed the 'spectacle' as the way images replace lived reality."
,
maxwell:"James Clerk Maxwell's 1865 equations unified electricity, magnetism and light into a single theory of fields. He showed that electromagnetic disturbances travel as waves at a speed matching that of light, so light itself had to be one of them. This replaced separate forces with vibrating fields filling space, and it made radio, radar and wireless communication possible. It also raised a puzzle about what the waves moved through, which Einstein later resolved by dropping the idea of a fixed medium. Maxwell's mathematics is the bridge between Newton's mechanical universe and the wave and field thinking behind quantum theory, electronic music and modern media.",
lovelace:"In 1843 Ada Lovelace translated an article on Charles Babbage's proposed Analytical Engine and added notes longer than the original. She described how the machine could follow a sequence of instructions, including a method for computing Bernoulli numbers that is often called the first published program. More importantly, she suggested that such a machine might manipulate any symbols, even musical notes, not only numbers. That leap from calculation to general symbol handling anticipates computers, algorithmic music and AI. She also cautioned that the engine could only do what it was told, a point still debated whenever people ask whether machines can be creative.",
boole:"George Boole's 1854 book The Laws of Thought treated logic as algebra, with statements that are either true or false combined by AND, OR and NOT. At the time it looked like an abstract exercise in philosophy and mathematics. Nearly a century later Claude Shannon showed that electrical switches behave exactly like Boolean operations, so circuits could carry out logical reasoning. Every digital computer, search query and logic gate now rests on Boole's idea. It also shows how a description of thought, once reduced to symbols, can be turned into machinery, which links the history of logic to the history of automation and information.",
mcluhan:"Marshall McLuhan argued in Understanding Media (1964) that the form of a medium shapes society more than the content it carries. A printed page encourages linear, private thought, while television and electronic media create a shared, immediate 'global village'. His slogan, the medium is the message, asks us to look at how writing, print, radio or the web change attention, politics and community, not only what they say. Critics find his claims loose and his predictions uneven, yet his view of technology as an extension of the body and senses remains a powerful lens for connecting printing, broadcasting, propaganda and the internet.",
benjamin:"In his 1935 essay on art in the age of mechanical reproduction, Walter Benjamin argued that photographs, film and recordings strip an artwork of its aura, the unique presence tied to one place and time. Copies let art reach millions and weaken the authority of museums and elites, but they also make images easy for politics to use. Benjamin warned that fascism turned mass spectacle into an aesthetic experience, while he hoped film might be used for collective emancipation. The essay connects photography, cinema, tape and sampling, and it still frames debates about originals, copies, streaming and digital images today.",
pop:"Pop art, which emerged in the 1950s and 1960s, took the imagery of advertising, comics and supermarket goods and treated it as serious subject matter. Andy Warhol's soup cans and screen-printed celebrities, made from 1962, borrowed the factory logic of repetition and mass production, while Richard Hamilton in Britain and Roy Lichtenstein in the United States explored similar territory. The movement blurred the line between high art and commercial culture and asked what happens to originality when images are endlessly copied. It echoes Duchamp's readymades and Benjamin's argument about reproduction, and it prefigures sampling in music, where existing recordings become raw material for something entirely new.",
schafer:"Canadian composer R. Murray Schafer coined the term soundscape and founded the World Soundscape Project at Simon Fraser University in the early 1970s. His 1977 book The Tuning of the World urged people to treat the sonic environment as something designed, polluted or cared for, much like a landscape. He distinguished keynote sounds, signals and soundmarks, and he promoted 'ear cleaning' exercises to sharpen attention. His work links field recording, Luc Ferrari and Cage-style listening with ecology and urban planning, and it prompted later study of noise pollution, natural sound archives and the idea that listening is a social and environmental skill.",
gestalt:"Gestalt psychology began around 1912 with Max Wertheimer's studies of apparent motion, later developed by Kurt Koffka and Wolfgang Köhler. Its central claim is that we perceive organised wholes, not collections of separate sensations: the brain groups elements by proximity, similarity, closure and continuity. A set of still frames becomes a moving image, and a few dots become a face. This was a direct challenge to reductionist accounts of the mind and a reminder that perception is constructive. Designers at the Bauhaus and later graphic artists used Gestalt principles, and the same idea explains why a melody is heard as a shape rather than a string of single notes.",
kuhn:"Thomas Kuhn's 1962 book The Structure of Scientific Revolutions argued that science does not simply accumulate facts. Long periods of 'normal science' work inside a shared paradigm, until anomalies pile up and a crisis produces a revolution, as when Newtonian physics gave way to relativity and quantum theory. Because different paradigms use different concepts, their supporters can talk past each other. Critics say Kuhn overstated this, yet his work changed how historians and teachers describe progress. It undermines the tidy, linear story of knowledge and supports the idea that the clockwork universe was one framework among others, not the final truth.",
indra:"Indra's net is an image from the Huayan school of Buddhism, drawing on older Indian ideas, describing a vast net with a jewel at every knot. Each jewel reflects all the others, so the whole universe is contained in every part. It expresses interdependence: nothing exists alone, and every thing is defined by its relations. The picture offers a striking contrast with reductionism, where understanding comes from isolating parts, and it resonates with ecology, network theory and the web. Modern writers often compare it with fungal networks, the internet and Gaia thinking, though it is a metaphor within a religious tradition, not a scientific claim.",
bucky:"Buckminster Fuller patented the geodesic dome in 1954, a light structure made of triangles that gets relatively stronger as it grows. He called himself a design scientist and urged using the minimum material for the maximum effect, a principle he summed up as 'doing more with less'. His Spaceship Earth metaphor treated the planet as a closed system with finite resources, ideas that fed the environmental movement and the Whole Earth Catalog. In short, Fuller combined engineering, systems thinking and utopian optimism, which makes him a link between Bauhaus-style modern design, biomimicry, ecology and later debates about technology and sustainability across the whole century.",
eiffel:"Built for the 1889 Paris World's Fair, the Eiffel Tower showed that an engineer's wrought-iron lattice could be both a landmark and a work of art. Gustave Eiffel's firm assembled some 18,000 parts with extraordinary precision, and at 300 metres it was the tallest structure in the world for decades. It advertised French industrial and colonial strength, gave ordinary people their first view of a city from above, and became a symbol of the machine age's confidence. Artists and critics first protested against it, then Parisians came to love it. It later served as a radio mast, tying the monument to the history of broadcasting.",
wright:"On 17 December 1903 Orville and Wilbur Wright made the first sustained, controlled, powered flights at Kitty Hawk, North Carolina, the longest lasting 59 seconds. The brothers were bicycle makers who built their own wind tunnel and worked out wing control by careful experiment rather than inspiration. Within a few years aircraft changed warfare, travel and the way people imagined distance, and artists such as the Futurists treated flight as the emblem of speed and modernity. Flight also became a powerful sign of technological progress, feeding the belief that human ingenuity could overcome any natural limit, a belief later challenged by environmental thinking.",
bleriot:"Louis Blériot flew across the English Channel on 25 July 1909 in a small monoplane, winning a newspaper prize and ending Britain's sense of island security. The flight took about thirty-seven minutes and made headlines worldwide, proving that aeroplanes could cross borders as easily as ships. It marked a shift in how people thought about distance, nations and war, and military planners quickly took notice. For artists, the event confirmed the Futurist faith in speed and machines. Blériot's flight, like the Wright brothers', shows how a single publicised feat can change cultural expectations and open the way to mass air travel, global trade and modern tourism.",
peguy:"The French poet and essayist Charles Péguy is often quoted for the claim that the world changed less from the time of Jesus to his own childhood than it had since. Whatever its exact wording, the remark captures the shock felt by people around 1900, when electric light, telephones, railways, cars and mass media rearranged daily life within a single generation. Péguy was no simple modernist; he feared that commerce and mechanisation would hollow out older forms of faith and community. His observation helps explain why the early twentieth century produced so many manifestos, movements and experiments, each trying to make sense of a world that no longer resembled its past.",
tycoon:"Industrial tycoons such as Andrew Carnegie, John D. Rockefeller and Cornelius Vanderbilt built vast fortunes in steel, oil and railways during the late nineteenth century, an era often called the Gilded Age. Their companies relied on mass production, cheap labour, new transport networks and financial innovation, and they funded museums, libraries and universities as well as skyscrapers. Critics called them robber barons for crushing competitors and exploiting workers. Their wealth shaped cities, architecture and education, promoting the idea that efficiency and scale were measures of progress. The same culture produced the early steel-frame skyscrapers of Chicago and New York, and it formed the economic backdrop for industrial schooling and machine-age optimism.",
neuro:"Neuroplasticity is the brain's ability to change its connections in response to experience, learning and injury. Donald Hebb's 1949 idea, often summed up as neurons that fire together wire together, proposed a mechanism, and later work showed that adult brains keep reorganising: London taxi drivers enlarge memory regions, stroke patients regain functions through rerouted pathways, and musicians show distinct auditory maps. The finding overturned the older view of a fixed, machine-like brain and supports the claim that teaching, practice and environment matter. It also links to phantom limb pain, where the map of the body persists, and to arguments that schools shape minds, not just fill them.",
socpsy:"Social psychology studies how thoughts, feelings and behaviour are shaped by other people, real or imagined. It grew in the twentieth century from work by Kurt Lewin, Solomon Asch and Stanley Milgram, who tested conformity, obedience and group pressure in the laboratory. Its findings suggest that situations often explain behaviour better than personality does, which complicates stories that treat individuals as isolated, rational agents. Some famous studies have since been criticised for methods or failed replication, so conclusions need care. The field connects naturally to propaganda, advertising, education and collaboration, because all of them rely on understanding how people influence and are influenced by one another.",
conform:"In the early 1950s Solomon Asch asked volunteers to match line lengths while actors deliberately gave wrong answers. Roughly a third of responses went along with the group, even though the correct answer was obvious, and about three quarters of participants conformed at least once. The experiments suggested that social pressure can override direct perception, which links to optical illusions and the idea that the senses are not simple recording devices. Later variants found that a single dissenting voice sharply reduced conformity. The studies are often used to explain how propaganda, fashion and institutional habits spread, and why collaboration needs room for disagreement to avoid groupthink.",
milgram:"In 1961 Stanley Milgram at Yale recruited volunteers to give what they believed were increasingly painful electric shocks to a learner, urged on by an experimenter in a lab coat. About two thirds went to the maximum voltage. Milgram argued that ordinary people may obey authority even against conscience, an idea shaped by questions raised during the Eichmann trial. Critics have since questioned the ethics, the staging and the interpretation, and some participants plainly doubted the setup. The work remains central to discussions of bureaucracy, propaganda and totalitarian states, showing how hierarchy and routine can distance individuals from responsibility for what they do.",
memory:"Frederic Bartlett's 1932 book Remembering showed that people recall stories not by replaying a recording but by rebuilding them from fragments and expectations. When British students retold a Native American tale, details shifted towards their own cultural assumptions with each retelling. Later research by Elizabeth Loftus found that suggestion can alter or even implant memories. This supports the view that the brain constructs experience, in line with illusions, phantom limbs and conflicting senses. It also matters for history: personal and collective memory are edited over time, which is one reason historians compare sources and ask who is remembering, for whom and why.",
mindful:"Mindfulness, drawn from Buddhist practices of attention and awareness, entered Western medicine in 1979 when Jon Kabat-Zinn founded a stress-reduction programme at the University of Massachusetts. It trains people to notice thoughts, sensations and sounds without judging them, and trials suggest benefits for stress, anxiety and relapse in depression, though effects are sometimes modest and the research is uneven. Critics also argue that commercial versions strip away the ethical framework of the original traditions and turn it into a productivity tool. The practice connects to listening, to Cage's silent piece, to Zen and to the contemplative side of Buddhism, which offers a contrast with machine-age ideas of efficiency.",
embodied:"Embodied cognition holds that thinking is not a purely abstract process in the head but depends on the body and its surroundings. The 1991 book The Embodied Mind by Varela, Thompson and Rosch brought Buddhist practice into dialogue with cognitive science, arguing that experience arises from action in the world. Everyday examples include gesturing to think, learning to dance, or understanding rhythm through movement. The view challenges the old picture of the mind as a computer processing symbols, and it supports the idea that the whole body listens. It also connects to phenomenology, to design that fits the human body, and to critiques of schools that rank mental subjects above physical ones.",
attn:"The attention economy treats human attention as a scarce resource that platforms compete to capture and sell. Herbert Simon observed in 1971 that an abundance of information creates a poverty of attention, and the idea became commercial reality with web advertising, social media feeds and notification design after the mid-2000s. Algorithms tune content to keep people engaged, which can reward outrage and novelty. Critics link the model to distraction, polarisation and mental health concerns, while defenders point to free services and new creative audiences. It echoes older concerns about propaganda, broadcast and advertising, and it raises the question of who profits when listening, reading and looking become commodities.",
dharma:"Dharma is a rich word in Indian traditions with several meanings: duty, righteousness, natural law and the teaching itself. In Hindu texts it often refers to the duties tied to a person's role in life and society, which was later used to justify caste. In Buddhism it means both the Buddha's teaching and the way things truly are, a path of understanding and compassion. Popular Western usage often shrinks it to destiny or purpose, which misses the sense of an underlying order that humans fit into rather than command. The idea contrasts with the Western picture of nature as a machine, and it sits alongside karma, cyclical time and interdependence.",
production:"In 1913 Henry Ford's Highland Park factory introduced a moving assembly line, cutting the time to build a Model T chassis from over twelve hours to about ninety minutes. Work was broken into small repeated tasks, following Frederick Taylor's scientific management, and cars became cheap enough for ordinary workers to buy. Mass production reshaped cities, wages and leisure, and it was admired by designers and politicians from the Bauhaus to the Soviet Union. It also deskilled labour, as Chaplin satirised in Modern Times. The same logic of standardisation and optimisation extends to industrial schooling, the Frankfurt Kitchen, prefabricated housing and, later, automation and AI.",
commerc:"Commercialisation turns activities, objects or knowledge into things bought and sold for profit. A landmark moment came in 1602, when the Dutch East India Company issued tradable shares and became a model for the modern corporation, combining long-distance trade, finance and state power. Spices, tea, textiles and enslaved labour moved through such networks, building wealth and empires. The same logic later reached art, music, education and personal data, which is why people ask whether creative work loses something when it is judged mainly by market value. It connects the Silk Road and tea trade to empire, advertising and the debates about whether schools should serve the economy.",
consumer:"Consumerism is the social order in which identity and happiness are tied to buying things. After the First World War, advertisers such as Edward Bernays, nephew of Sigmund Freud, applied ideas about the unconscious to public relations, selling products by linking them to desire and status. Installment credit, department stores and the radio spread the habit, and postwar suburbs made it a way of life. Critics argue it drives waste and inequality, while supporters point to choice and rising living standards. The topic ties together mass production, propaganda, the efficient home and later environmental concern, because the same techniques of persuasion serve both politics and markets.",
deforest:"Deforestation is the permanent removal of forest for farming, grazing, timber, fuel or building. Europe cleared much of its woodland by the Middle Ages, and the industrial era accelerated losses with railways, shipbuilding and steel. Today tropical clearing for cattle, soy and palm oil is the main driver. Forests store carbon, regulate rainfall, shelter most land-based species and support Indigenous livelihoods, so losing them speeds climate change and biodiversity decline. Policies range from protected areas to certification and payments for conservation, though results vary. The subject connects Newtonian ideas of nature as a resource to ecosystem thinking, Silent Spring, climate science and fungal networks, which show how a forest functions as a connected community.",
anthro:"The Anthropocene is a proposed name for an epoch in which human activity has become a dominant force shaping Earth's climate, geology and ecosystems. Chemist Paul Crutzen popularised the term around 2000, pointing to evidence such as carbon dioxide levels, plastics, radioactive fallout and mass extinction. Scientists debate the start date, with suggestions ranging from early agriculture to the nuclear tests of the 1950s, and in 2024 an international geological body declined to adopt it formally. Critics also say the word hides unequal responsibility between nations and classes. Still, it frames the idea that the clockwork universe is not separate from us, and it links industrialisation, climate science, Gaia thinking and biomimicry.",
schrod:"In 1935 Erwin Schrödinger proposed a thought experiment in which a cat in a sealed box is linked to a radioactive atom that may or may not trigger poison. Quantum theory, read literally, describes the atom as a superposition of decayed and not decayed, so the cat would seem both alive and dead until observed. Schrödinger meant it to show how strange, even absurd, that reading was, not to endorse it. The puzzle remains central to debates on the measurement problem, with interpretations including many worlds and decoherence. It echoes the double-slit experiment and the idea that observation matters, and it undermines the clockwork picture of a fully determined world.",
heisen:"In 1927 Werner Heisenberg showed that certain pairs of properties, such as a particle's position and momentum, cannot both be known with unlimited precision at once. This is not simply a flaw in measurement tools but a feature of how nature works, because particles behave like waves and a wave has no single sharp location. The principle ended the hope, voiced by Laplace, that complete knowledge of the present could predict the entire future. It is often confused with the observer effect, which is related but different. The same trade-off appears in Fourier analysis, where a sound cannot be pinned exactly in both time and frequency, tying physics to music and signal processing.",
greatman:"The great man theory of history, associated with Thomas Carlyle's 1840 lectures On Heroes, claims that the course of history is driven mainly by exceptional individuals such as kings, generals, prophets and inventors. It made for appealing stories and shaped school curricula, statues and national myths. Later historians argued that social forces, economies, technologies and ordinary people matter as much, and that credit given to a single genius often hides the collective work behind an invention, as the story of Cai Lun and paper shows. The debate links to Eurocentric framing, to Civilisation-style surveys that tell progress as a story of heroes, and to the question of who gets written out of history.",
emerge:"Emergence describes how complex systems display properties that cannot be found in their individual parts: a single ant is simple, yet a colony solves problems, and individual neurons do not think but brains do. The Santa Fe Institute, founded in 1984, helped establish complexity science, which studies networks, feedback, adaptation and self-organisation across biology, economics and computing. The idea is a counterpoint to reductionism, which assumes understanding comes from taking things apart, and it fits with chaos theory, ecosystems and fungal networks. It also raises questions about artificial intelligence, where large systems show abilities not obvious from their components. Complexity thinking encourages studying relationships and patterns, as well as parts, and it suits a map built from connections.",
biom:"Biomimicry is the practice of learning from nature's solutions in order to solve human design problems. Janine Benyus popularised the name in her 1997 book Biomimicry: Innovation Inspired by Nature, though earlier examples include Velcro, inspired by burrs, and Gaudí's branching columns. Well-known cases are Japanese bullet trains shaped after the kingfisher's beak, termite-mound ventilation in buildings and shark-skin surfaces that resist bacteria. Its principle is that after billions of years of testing, living things have found efficient, low-waste answers, so designers should study them rather than overpower nature. It contrasts with the older ladder-of-nature view, and it connects architecture, ecology, Gaia thinking and the idea that cultures should learn from what they build on.",
karma:"Karma means action and its consequences, and in Indian traditions it links what a person does with what later happens to them across many lives. In Buddhism the emphasis is on intention: skilful or unskilful states of mind shape future experience, rather than a cosmic scorecard of reward and punishment. Popular Western usage often reduces it to a simple everything happens for a reason or good deeds earn good luck, which distorts the teaching. In Hindu texts it is entangled with dharma, the duties of one's role, and the caste system used the connection to justify inequality, which reformers have long criticised. It sits beside cyclical time and interdependence, offering a different model from linear progress.",
spiral:"The spiral of fifths comes from Chinese tuning theory, described in texts such as the Guanzi and the Huainanzi. Pitches are generated by repeatedly multiplying string or pipe lengths by two thirds, then adjusting by octaves to stay within range. In theory the sequence never lands exactly back on the starting note, so it spirals instead of closing, a gap known in the West as the Pythagorean comma. Chinese thinkers tied the pitch pipes to the calendar, the emperor and social order, so that correct tuning meant a harmonious state. The idea shows that tuning is never neutral: it carries beliefs about mathematics, nature and authority, and it connects directly to equal temperament and the circle of fifths.",
throat:"Overtone singing, found in Mongolian khoomei, Tuvan khoomei and some Tibetan and South African traditions, lets one singer produce two or more pitches at once. By shaping the tongue, lips and throat the performer strengthens individual harmonics above a steady drone, so a whistle-like melody floats over the low note. Many traditions link the sounds to landscape, imitating rivers, wind and animals, and khoomei is on UNESCO's list of intangible cultural heritage. The technique is a living demonstration of the overtone series, showing in the body what Fourier analysis shows in mathematics. It also challenges the idea that a single sound has a single pitch, and it connects listening, voice and the physics of resonance.",
sacred:"Many religious traditions pass their texts on by singing or chanting rather than silent reading. Vedic recitation, Gregorian chant, Quranic tajwid, Buddhist sutra chanting and Jewish cantillation all use melodic formulas that help memory, fix pronunciation and give the words ceremonial weight. For centuries the Pali canon was preserved by groups of monks reciting together, and was written down only later. Because the melody is part of how the text is understood, hearing it is different from reading it. These practices show that sound was an early information technology, long before printing, and they link music to law, ritual and education. They also sit alongside the movement of texts along trade routes, where sung versions were translated and altered.",
kepler:"The music of the spheres is the old idea, traced to the Pythagoreans, that planets moving in perfect proportions produce a harmony no one can hear. Johannes Kepler revived it in Harmonices Mundi (1619), assigning musical intervals to the varying angular speeds of the planets and searching for numerical ratios in the heavens. The same book contains his third law of planetary motion, so the mystical and the scientific sit together on the page. Today no one believes planets literally sing, but the idea shaped astronomy, tuning and architecture for centuries, and it survives in sonification, where data from space is turned into sound. It is a clear example of number being used to link music, nature and order.",
overt:"A vibrating string or air column does not move in one simple motion; it vibrates as a whole and also in halves, thirds, quarters and so on, each producing a harmonic at two, three, four times the fundamental frequency. Together these overtones form the harmonic series, and the mix of strong and weak overtones gives each instrument its timbre. The French scientist Joseph Sauveur studied and named harmonics around 1700. The series explains why octaves and fifths sound consonant, since their frequencies relate by simple ratios. Fourier later showed that any complex sound can be built from sine waves, which is why the sine wave is sometimes called sound's atom, and why additive synthesis, spectrograms and the Moog all rest on it.",
split:"Music education has traditionally divided the subject into separate strands such as melody, harmony, rhythm, history and ear training, often taught in different classes and examined separately. This worked well for notated Western art music, but it leaves little room for timbre, noise, improvisation, studio production or music from cultures that do not separate those elements. Pierre Schaeffer complained that traditional categories could not describe sounds recorded from the world. The split mirrors the wider habit of reductionism in education, where subjects are walled off from each other, and it is one reason cross-disciplinary teaching is argued for. It also explains why electronic and experimental composers often invented their own vocabularies.",
dani:"Alain Daniélou, a French musicologist and Indologist, lived in India from the early 1930s and studied music with Indian teachers. His writings on scales, including work published in the 1940s and 1950s, compared Indian, Arab and Western tuning systems using mathematical measures such as cents. He argued that equal temperament, adopted as the Western standard, sacrificed the purity and expressive range of other systems, and that no tuning is naturally superior. His comparisons made non-Western music available to Western scholars on equal terms, though some of his wider mystical and cultural claims remain controversial. Daniélou links the story of tuning to cultural exchange and to the erasure of other traditions from the standard history.",
spec:"A spectrogram turns sound into a picture, showing frequency on one axis, time on the other and loudness as brightness or colour. The sound spectrograph developed at Bell Labs in the mid-1940s, first used in work on speech and called Visible Speech, applied the mathematics of Fourier analysis to make vowels, consonants and instruments visible. Linguists use spectrograms to study speech, biologists to study birdsong and whale calls, and musicians to examine timbre. Composers such as Iannis Xenakis and Aphex Twin have even drawn images that become sound when played. The technique makes the overtone series literally visible and shows how sound can be treated as light, tying acoustics to visual art and to the idea of sound as measurable pattern.",
string:"String theory proposes that the basic constituents of nature are not point-like particles but tiny one-dimensional strings whose different vibration modes appear to us as different particles, in the way a violin string produces different notes. It grew from work in the late 1960s on the strong force and, in the 1980s, became a candidate for unifying gravity with quantum physics, requiring extra dimensions of space. It has produced rich mathematics, but it has not made testable predictions confirmed by experiment, so many physicists regard it as unproven. As a metaphor it echoes Pythagoras and the monochord: the idea that reality, at bottom, is vibration and that harmony is the structure of the universe.",
chlad:"In 1787 the German physicist Ernst Chladni sprinkled sand on metal plates and drew a violin bow across the edge. The sand jumped and gathered along the lines where the plate was still, forming intricate patterns that changed with each pitch and plate shape. These nodal lines made vibration visible and helped found modern acoustics. Napoleon was impressed by a demonstration in 1809 and sponsored a prize for a mathematical explanation, which Sophie Germain eventually won with her theory of elastic surfaces. Chladni travelled Europe performing the experiment and also made new instruments. His figures inspired later work on resonance, including Hans Jenny's cymatics, and they remain a favourite classroom and art demonstration of how sound shapes matter.",
helm:"Hermann von Helmholtz, a German physicist and physician, published On the Sensations of Tone in 1863, bringing physics and physiology together to explain hearing. Using hollow resonators he picked out individual harmonics from complex sounds and showed that timbre depends on the mix of overtones. He explained beats and the roughness of dissonance as interference between nearby frequencies, and proposed that structures in the inner ear respond to different pitches by resonance. His work gave consonance a physical basis, though later research showed that culture and training also shape what sounds pleasant. Helmholtz is a bridge between Fourier's mathematics, Chladni's patterns and later experiments with synthesised sound and electronic music.",
noise:"Coloured noise describes random signals by how their energy is spread across frequencies, borrowing the language of light. White noise has equal energy at every frequency and sounds like a hiss. Pink noise, with equal energy in each octave, sounds more balanced to human ears and is used to test rooms and speakers. Brown noise is deeper and rumbling, while blue and violet noise tilt towards high frequencies. Many natural processes, from heartbeats to river flows, show similar 1/f patterns. Noise generators are part of synthesisers, and composers from Luigi Russolo to the Japanese noise scene have treated noise as music in its own right, challenging the boundary between sound and unwanted sound.",
specul:"Hans Jenny's striking images of sand, powders and fluids forming patterns under vibration inspired many people to claim that sound shapes the living world. Popular books and websites suggest that cymatics explains the form of the spine, cathedrals, galaxies or even the origin of life, and some promote healing frequencies or special numbers such as 528 Hz. The physics of the patterns is well understood as standing waves on surfaces and in liquids, but resemblance between shapes is not evidence of shared cause. Scientists treat the broader claims as unproven or false. The topic is useful for learning how to separate a real phenomenon from speculation, while still showing why the images attract artists and designers.",
democ:"Democritus, a Greek thinker from Abdera born around 460 BCE, and his teacher Leucippus proposed that everything consists of atoms, eternal, indivisible particles moving in empty space. Atoms differed in shape, size and arrangement, and the variety of the world came from their combinations. The idea was reasoned, not tested, and Aristotle rejected it, so it was largely sidelined until Epicurus and the Roman poet Lucretius kept it alive. In the early nineteenth century John Dalton gave atoms an experimental basis, though modern physics found they can be divided into smaller parts. The story shows how an ancient philosophical picture became the template for reductionism, with the belief that understanding comes from the smallest pieces.",
euclid:"Euclid, working in Alexandria around 300 BCE, collected and organised Greek geometry in the Elements, building hundreds of theorems from a few definitions and postulates. His points have no size and his lines no thickness, so he describes perfect forms that cannot be found in nature. The book became a model of logical proof for more than two thousand years and shaped teaching, architecture and philosophy, including Plato's idea of ideal forms. In the nineteenth century mathematicians questioned his parallel postulate and found consistent non-Euclidean geometries, which Einstein later used to describe curved space. Euclid represents the Western ideal of certainty and perfection, and shows how useful abstractions can also mislead about the real world.",
dslit:"In 1801 Thomas Young passed light through two narrow slits and saw bands of bright and dark where the waves overlapped, strong evidence that light behaves as a wave. In the twentieth century the same pattern appeared when electrons, and later atoms and molecules, were fired one at a time, which suggested each particle somehow travels through both slits. When detectors are placed to find out which slit was used, the pattern vanishes. This shows that measurement interacts with the system, not that human minds create reality, as popular accounts sometimes imply. Richard Feynman called it the central mystery of quantum mechanics. It feeds into debates about observation, Schrödinger's cat and the limits of a deterministic universe.",
elec:"In the nineteenth century electricity came to be understood as something that can vibrate. Michael Faraday's discovery of induction in 1831 showed how moving magnets create currents, leading to generators and alternating current that oscillates many times a second. Heinrich Hertz's experiments in 1887 and 1888 proved that electromagnetic waves could be produced and detected, confirming Maxwell's theory and opening the way to radio. Telephones and microphones turned sound vibrations into electrical vibrations, and later synthesisers used electronic oscillators to generate pitch directly. Seeing electricity as waves with frequency and energy links physics, communication and music, and it prepared the ground for electronic instruments and the sound of the twentieth century.",
einst:"In 1905, often called his miracle year, Albert Einstein published papers on special relativity, the photoelectric effect, Brownian motion and the equivalence of mass and energy, summarised as E=mc2. He showed that the speed of light is the same for every observer and that time and space are relative, overturning Newton's absolute framework. His explanation of the photoelectric effect, for which he won the 1921 Nobel Prize, treated light as quanta and helped start quantum theory, while his analysis of Brownian motion gave strong evidence for atoms. In 1915 general relativity described gravity as curved spacetime. Einstein remained uneasy about quantum randomness, famously doubting that God plays dice, and his work marks the end of the clockwork universe.",
quark:"Quarks are particles that combine to make protons, neutrons and other hadrons. Murray Gell-Mann and George Zweig proposed them independently in 1964, and Gell-Mann took the name from a line in James Joyce's Finnegans Wake. At first they seemed like a mathematical convenience, but scattering experiments at SLAC in the late 1960s showed that protons contain point-like constituents. There are six types, called flavours, and they are never seen alone, because the strong force grows with distance and confines them. Quarks sit at the end of a chain that began with atoms, then nuclei, then nucleons, and each step revealed a deeper layer. String theory suggests there may be more beneath, though that is not established.",
silk:"The Silk Road was not one road but a web of overland and sea routes linking China with Central Asia, India, Persia and the Mediterranean. Its traditional starting point is the Han envoy Zhang Qian's journeys around 130 BCE, and the name itself was coined by the German geographer Ferdinand von Richthofen in 1877. Silk, spices, glass, horses and metalwork moved along it, but so did religions, crafts and technologies, including Buddhism, papermaking and printing. Oasis cities such as Dunhuang and Samarkand grew rich as middlemen. Goods rarely travelled the whole distance in one journey, so ideas spread by relay, changing at every stop, which makes the route a good model for how knowledge really travels between cultures.",
paper:"Tradition credits Cai Lun, an official at the Han court, with inventing paper and presenting it to the emperor in 105 CE, made from bark, rags, hemp and old fishing nets. Archaeological finds of paper fragments from earlier centuries show that the material existed before him, so he is better seen as someone who refined the process and promoted it. Paper was far cheaper and lighter than silk or bamboo strips, and it made record keeping, administration and learning easier to spread. Knowledge of papermaking travelled through Korea and Japan, then west along trade routes. The story is a classic case of one named individual receiving credit for what was probably a collective, gradual development.",
dun:"Dunhuang, an oasis on the edge of the Taklamakan desert in Gansu, was a crossroads of the Silk Road where merchants, monks and soldiers met. Monks began carving the Mogao caves in 366 CE, and over centuries around five hundred caves were decorated with Buddhist murals and sculpture. About the year 1000 a library cave was sealed, then rediscovered in 1900 by a Daoist caretaker, Wang Yuanlu. It held tens of thousands of manuscripts in Chinese, Tibetan, Sogdian and other languages, including the Diamond Sutra of 868. Explorers such as Aurel Stein and Paul Pelliot removed many of them in the early 1900s. Dunhuang shows religion, art, writing and printing moving together along trade routes.",
bagh:"Baghdad, founded in 762 as the Abbasid capital, became a centre of learning in the following century. Paper reached the Islamic world through Central Asia, with the legend that Chinese papermakers captured after the Battle of Talas in 751 taught the craft, though historians debate the details. The first paper mill in Baghdad is usually dated to about 794, during the reign of Harun al-Rashid. Cheap paper fed a boom in copying, bookshops and libraries, and supported the translation movement associated with the House of Wisdom, which rendered Greek, Persian and Indian works into Arabic. From there paper spread to Damascus, Cairo and Islamic Spain. The city shows how a technology can transform an intellectual culture.",
tang:"Under the Tang dynasty, Chinese printers carved whole pages into wooden blocks, inked them and pressed paper onto them. The oldest dated printed book is the Diamond Sutra, produced in 868 CE and found in the Dunhuang library cave, now in the British Library. It is a scroll about five metres long with a carved illustration at the start. Early printing served Buddhist devotion, calendars, almanacs and dictionaries, where many identical copies were useful. Movable type came later: Bi Sheng made clay type in the 1040s, and Korean printers used metal type in the thirteenth and fourteenth centuries. These developments are a reminder that printing was well established in East Asia centuries before Gutenberg.",
eupaper:"Papermaking reached Europe from the Islamic world, first through Spain and then Italy, where mills at Fabriano developed in the thirteenth century. Italian makers introduced water-powered stamping hammers to pulp rags and added gelatin sizing and watermarks, which identified the mill and the paper's quality. Paper was much cheaper than parchment made from animal skins, and its supply grew as towns produced rags. It served merchants, notaries, universities and bureaucracies long before printing. When Gutenberg's press arrived in the mid-fifteenth century, there was already a plentiful, affordable material to print on, which helps explain how fast printing spread. The story is another example of Eastern technology becoming the foundation of European change.",
gut:"Around 1450 in Mainz, the goldsmith Johannes Gutenberg combined movable metal type cast in a durable alloy, an oil-based ink and a press adapted from wine and olive presses. His 42-line Bible, finished about 1455, showed that books could be produced faster, more uniformly and in larger numbers than by hand copying. Printing was not new, since East Asia had woodblock and movable type earlier, but the European alphabet suited type well, and commercial printers spread the technology across the continent within decades. By 1500 millions of books were in circulation. Printing standardised texts and languages, supported science and reform movements, and made publishing a business, which is why its story is often told as a turning point.",
reform:"The Reformation is usually dated from 1517, when Martin Luther circulated his Ninety-five Theses criticising the sale of indulgences. Printing carried the debate with unprecedented speed: pamphlets, sermons and woodcut images reached towns across Germany within weeks. Luther's German translation of the New Testament in 1522 and the whole Bible in 1534 helped fix a common written German and encouraged people to read scripture themselves, which promoted schooling. The movement split Western Christianity, fed wars and political change, and prompted a Catholic response that also used print and education. It is a prime example of media transforming society, and of propaganda spread by cheap images and short texts, long before radio or the internet.",
darwin:"Charles Darwin's On the Origin of Species, published in 1859, argued that species change over time through natural selection: individuals vary, some variations are inherited, and those that help survival and reproduction become more common. Alfred Russel Wallace reached the same idea independently. Evidence came from fossils, geographic distribution, comparative anatomy and the results of selective breeding. Darwin's picture replaced the fixed ladder of creation with a branching tree in which no species is higher than another. Heredity was not understood until genetics was combined with evolution in the early twentieth century. The theory was also misused in social Darwinism to justify inequality and empire, which is why historians treat the science and its political uses separately.",
thermo:"Thermodynamics developed in the nineteenth century from the study of steam engines, beginning with Sadi Carnot in 1824. The first law states that energy is conserved, while the second, formulated by Rudolf Clausius around 1850, says that in a closed system entropy, or disorder, tends to increase, so heat flows from hot to cold and no engine is perfectly efficient. These laws explain why industrial machines need fuel and why time has a direction. Living things and the Earth stay organised because they are open systems fed by energy from the sun. Entropy also entered information theory through Shannon, and it supports ecological arguments about waste and limits to growth, tying engineering to the environment.",
ecosys:"The word ecosystem was coined by the British botanist Arthur Tansley in 1935 to describe living organisms together with their physical environment, treated as a single system. Ecosystems are studied through energy flow and nutrient cycles: sunlight is captured by plants, passes through food webs of herbivores and predators, and is recycled by decomposers such as fungi and bacteria. Raymond Lindeman's 1942 work on a lake quantified energy transfer between levels. The concept moved attention from individual species to relationships, replacing ideas of a fixed natural order with dynamic, connected systems that can be disturbed. It underlies conservation policy, Silent Spring, the Gaia hypothesis and recent research on forests as networked communities.",
carson:"Rachel Carson's Silent Spring, published in 1962 and first serialised in The New Yorker, documented how pesticides such as DDT accumulated in the food chain, thinning bird eggshells and killing wildlife. Carson, a marine biologist, wrote clearly and accessibly, linking chemical use to the health of ecosystems and people. Chemical companies attacked her work and her credibility, but a presidential advisory panel largely backed her findings. Public concern helped lead to the creation of the US Environmental Protection Agency in 1970 and the ban on DDT for agricultural use in 1972. The book is widely seen as a starting point of the modern environmental movement and a challenge to the belief that science and industry control nature.",
gaia:"The Gaia hypothesis, put forward by James Lovelock in the early 1970s with the microbiologist Lynn Margulis, proposes that living organisms and their surroundings form a self-regulating system that keeps conditions on Earth suitable for life. The name came from the Greek goddess of Earth, suggested by the novelist William Golding. Lovelock's Daisyworld model from 1983 showed how simple feedbacks between life and temperature could stabilise a planet. Early versions were criticised as teleological, implying that the Earth acts with purpose, and the strong form is not widely accepted. The idea helped inspire Earth system science, which studies how biology, geology and the atmosphere interact, and it influenced spiritual and environmental thinking about the planet as a whole.",
climate:"Climate science grew from a long chain of discoveries: Joseph Fourier realised in the 1820s that the atmosphere warms the planet, John Tyndall measured heat absorption by gases in 1859, Svante Arrhenius calculated the effect of carbon dioxide in 1896, and Charles Keeling's measurements from 1958 showed concentrations rising. In 1988 James Hansen told a US Senate committee that warming was already detectable, and the same year the Intergovernmental Panel on Climate Change was founded. Its assessments conclude that burning fossil fuels and clearing forests are heating the planet, with growing risks from sea level rise, heat, drought and storms. International agreements such as the Paris Agreement of 2015 aim to limit warming through emissions cuts.",
golden:"The golden ratio, about 1.618, is the proportion in which a line is divided so that the whole relates to the larger part as the larger part relates to the smaller. Euclid described it as extreme and mean ratio, and Luca Pacioli promoted it in De divina proportione of 1509, illustrated by Leonardo da Vinci. It appears in the geometry of the pentagon and is linked to the Fibonacci sequence. Popular claims that it governs the Parthenon, the Mona Lisa or human beauty are mostly exaggerated or based on selective measurement. Architects such as Le Corbusier used it deliberately in the Modulor system, so it matters as a design tool even though its supposed universality in nature is largely a myth.",
fibo:"Leonardo of Pisa, known as Fibonacci, published Liber Abaci in 1202, a book that introduced the Hindu-Arabic numerals to European merchants and showed how they simplified arithmetic. It also contained a problem about breeding rabbits whose solution produces the sequence 1, 1, 2, 3, 5, 8, in which each number is the sum of the previous two. Indian mathematicians such as Pingala and Hemachandra had described the sequence centuries earlier in connection with poetic metre. The ratio of neighbouring terms approaches the golden ratio, and similar numbers appear in the spirals of sunflowers and pine cones, though less universally than popular accounts suggest. The story shows mathematics travelling along trade routes from India through the Islamic world to Europe.",
calc:"Calculus is the mathematics of change and accumulation, built on the ideas of the derivative, which measures rates of change, and the integral, which adds up quantities. Isaac Newton developed his method of fluxions in the 1660s, and Gottfried Leibniz independently created the notation still used today, publishing in 1684, while Newton's Principia of 1687 applied the ideas to motion. A bitter priority dispute followed. Earlier thinkers, including Archimedes and the Kerala school of astronomers led by Madhava, had used related methods. Calculus allowed scientists to describe planets, projectiles, heat and waves precisely, and it became the language of the clockwork universe, which later developments such as chaos and quantum theory complicated.",
fourier:"In 1822 Joseph Fourier published his Analytic Theory of Heat, which contained a startling claim: any repeating wave, however irregular, can be written as a sum of simple sine and cosine waves of different frequencies. He developed the idea to model how heat spreads through a solid, but it proved to be one of the most useful tools in science. Fourier analysis underlies spectrograms, audio compression such as MP3, image processing, medical imaging and radio. In music it explains timbre as a mixture of harmonics, connecting Pythagoras's ratios to modern digital sound. It also contains a built-in trade-off between time and frequency, the same mathematics that appears in the uncertainty principle of quantum mechanics.",
godel:"In 1931 the Austrian logician Kurt Gödel proved two incompleteness theorems. The first shows that any consistent formal system strong enough to describe arithmetic contains true statements that cannot be proved within it. The second shows that such a system cannot prove its own consistency. The results ended David Hilbert's programme to build mathematics on a complete and provably consistent foundation, and they set limits on what rule-based reasoning can achieve. Gödel's methods influenced Alan Turing's work on computability. Popular accounts often stretch the theorems to claim that human minds exceed machines or that truth is relative, which they do not establish. The proof is nonetheless a landmark in the history of logic and a challenge to the dream of perfect certainty.",
turing:"In 1936 Alan Turing published On Computable Numbers, describing an imaginary machine that reads and writes symbols on an endless tape according to a table of rules. He showed that a single universal machine can imitate any other such machine, which is the theoretical basis for the programmable computer, and proved that some problems, such as the halting problem, cannot be solved by any algorithm. During the Second World War Turing worked on breaking German ciphers at Bletchley Park, and in 1950 he proposed what became known as the Turing test for machine intelligence. His abstract approach connects Boole's logic and Gödel's limits to the first digital computers, early computer music and today's debates about artificial intelligence.",
pyth:"Pythagoras, who lived around 570 to 495 BCE and taught in Croton in southern Italy, is credited with discovering that musical intervals correspond to simple number ratios: an octave is 2:1, a fifth 3:2 and a fourth 4:3. The usual story involves blacksmiths' hammers, which is almost certainly legend, but the monochord, a single string divided by a movable bridge, genuinely demonstrates the ratios. He left no writings, so much attributed to him comes from followers and later authors. His school held that number underlies everything, which gave rise to the idea of the harmony of the spheres. Pythagorean tuning, built from stacked fifths, shaped Western music for centuries and introduced the problem of the comma that equal temperament later hid.",
equal:"Equal temperament divides the octave into twelve identical semitones, each with a frequency ratio of the twelfth root of two. The prince Zhu Zaiyu calculated it in China in 1584, and European theorists such as Simon Stevin and Marin Mersenne worked on similar ideas around the same time. It spread gradually through the eighteenth and nineteenth centuries and became the standard for pianos. Its great advantage is that music can move into any key and sound equally acceptable, which enabled the harmonic adventures of Romantic and modern music. The cost is that every interval except the octave is slightly out of tune compared with pure ratios, and critics argue that it flattens the distinct colours of different keys and non-Western scales.",
jenny:"Hans Jenny, a Swiss physician and natural scientist who lived from 1904 to 1972, coined the term cymatics, from the Greek word for wave. Using crystal oscillators, he vibrated sand, powders, pastes and liquids on metal plates and membranes, then photographed and filmed the patterns, collecting them in the books Kymatik (1967) and Cymatics. He built an instrument called the tonoscope to show the shapes of the voice. His images followed Chladni's earlier work and are striking, especially in motion, as droplets turn into stars and spirals. Jenny himself leaned towards philosophical interpretations that saw vibration as a creative principle, which others later stretched far beyond what the evidence supports.",
player:"The player piano plays itself from a paper roll punched with holes, which a pneumatic mechanism reads to strike the keys. The Pianola, introduced in the 1890s, put the technology in homes, and by the 1910s and 1920s millions of rolls were sold. Reproducing versions captured pianists' actual timing and dynamics, preserving performances before the gramophone matched them. Composers also saw possibilities: Igor Stravinsky wrote a piece for pianola in 1917, and Conlon Nancarrow punched rolls by hand from the 1940s to create rhythms too complex for human players. The player piano is an early form of programmable music, a direct ancestor of the sequencer, MIDI and computer composition, and it raises the question of whether machine performance can be musical.",
optic:"An optical soundtrack records sound as a photographic pattern along the edge of a film strip, which a light and photocell read during projection. Developed in the 1920s by inventors including Lee de Forest and the teams behind Fox Movietone, it kept sound and image perfectly in sync, which made it practical for the arrival of talking pictures. Because the sound was visible, artists realised they could draw or photograph patterns directly to create new sounds. Arseny Avraamov in the Soviet Union, Oskar Fischinger in Germany and Norman McLaren in Canada made synthetic sound this way, anticipating electronic music. The method remained standard in cinemas for decades before magnetic and digital systems replaced it.",
mart:"The Ondes Martenot is an electronic instrument invented by the French cellist and radio operator Maurice Martenot, first presented in Paris in 1928. The player wears a ring attached to a wire to slide smoothly between pitches, and uses a keyboard that can also be vibrated for expressive effects. A special set of speakers, including one with strings and one with a gong-like resonance, colour the sound. Its voice-like, eerie quality attracted composers such as Olivier Messiaen, who used it in the Turangalîla Symphony of 1948, and later Jonny Greenwood of Radiohead. Along with the theremin, it was one of the first electronic instruments to enter the concert hall, and it is still taught at French conservatories.",
theremin:"The theremin was invented in 1920 by the Russian physicist Léon Theremin, and it is played without touching it. Two antennas sense the distance of the player's hands, one controlling pitch and the other volume, so the music is shaped by gestures in the air. Theremin demonstrated it to Lenin, toured Europe and the United States, and RCA manufactured a commercial version in 1929. Virtuosos such as Clara Rockmore showed its expressive potential, and its wavering tone became a favourite of film soundtracks, notably in 1940s science fiction and thrillers. Robert Moog began his career by building theremins. The instrument is a bridge between physics, dance and music, and it raised questions about what it means to play an instrument.",
tape:"Magnetic tape recording was developed in Germany, beginning with Fritz Pfleumer's 1928 patent for paper tape coated with iron oxide and leading to the AEG Magnetophon of 1935, which produced remarkably high-quality sound. After the war, American engineers such as Jack Mullin took machines home, and the company Ampex marketed them from 1948, making tape standard in radio and recording studios. Unlike discs, tape can be cut, spliced, looped, reversed and sped up or slowed down, and Les Paul used it for multitracking. This turned recording from capturing a performance into composing with sound itself. Tape was the essential tool of musique concrète, minimalism, dub and 1960s pop, and it is a precursor to digital editing.",
conc:"Musique concrète began in Paris in 1948, when the engineer and broadcaster Pierre Schaeffer used the studio of French radio to record sounds from the real world, such as trains, and manipulate them. By cutting, looping, reversing and changing the speed of recordings, he made compositions from what he called sound objects, judged by how they sounded rather than their source. With Pierre Henry he created Symphonie pour un homme seul in 1950, and in 1958 he founded the Groupe de Recherches Musicales. Concrète contrasts with the Cologne school's synthesised music, but the two soon merged. Its ideas of listening to sound for itself underlie sampling, field recording, electroacoustic music and the soundscape movement.",
mclaren:"Norman McLaren, born in Scotland in 1914, spent most of his career at the National Film Board of Canada, where he made experimental films that combined sound and image in new ways. He painted and scratched directly on film strips, and he created synthetic soundtracks by photographing cards printed with patterns of lines, which the optical sound system turned into musical tones, as in Synchromy of 1971. He won an Academy Award for Neighbours in 1952, a pixilation film using live actors as stop-motion subjects. McLaren thought of film as a form of music, and his work links animation, abstract art and electronic sound, showing that image and sound can be generated from the same material.",
stockh:"Karlheinz Stockhausen, born in 1928, studied with Olivier Messiaen in Paris, worked briefly with Pierre Schaeffer in 1952, and then joined the electronic music studio of West German radio in Cologne. His Studie II of 1954 was built entirely from sine tones, while Gesang der Jünglinge, finished in 1956, combined a recorded boy's voice with electronic sounds and placed them around the listener through five loudspeaker groups. He later composed Kontakte, Hymnen and large-scale works for live electronics, and thought deeply about space, time and spirituality. His influence reached rock and jazz: the Beatles placed him on the Sgt. Pepper cover, and bands such as Can studied with him. He was a central figure in bringing electronic music to a wide audience.",
cmusic:"Computer music began in 1957 when the engineer Max Mathews at Bell Labs wrote MUSIC, a program that turned numbers into sound, producing a short melody. The same year, Lejaren Hiller and Leonard Isaacson used the ILLIAC computer at the University of Illinois to compose the Illiac Suite for string quartet, an early example of algorithmic composition. In 1961 a computer sang Daisy Bell, later echoed in 2001: A Space Odyssey. Mathews' MUSIC-N family of languages led to modern software such as Csound, while John Chowning discovered frequency modulation synthesis at Stanford in the late 1960s. These pioneers showed that sound could be described entirely mathematically, extending the line of Pythagoras and Fourier into the digital age.",
moog:"Robert Moog introduced his voltage-controlled modular synthesiser in 1964, based on the idea that one electrical signal can control another, so oscillators, filters and amplifiers can be patched together to shape sound. Keyboards made it playable, and its warm tones attracted musicians. Wendy Carlos's Switched-On Bach, released in 1968, brought it into popular awareness and became a bestselling classical album. The compact Minimoog of 1970 made synthesisers practical for touring bands, and the sound appeared in progressive rock, jazz, disco and hip-hop. Rivals, such as Don Buchla on the American West Coast, took a more experimental approach. The Moog shows how a tool built on Fourier's theory of tone became an instrument that anyone could play.",
ferrari:"Luc Ferrari was a French composer who helped found the Groupe de Recherches Musicales with Pierre Schaeffer in 1958. His best-known piece, Presque rien no. 1, finished in 1970, condenses a day's dawn at a Yugoslav fishing village into about twenty minutes, using recordings of birds, boats, voices and footsteps edited with very little processing. Ferrari called this approach anecdotal music, because the sounds keep their recognisable stories rather than being abstracted. The work challenged the idea that musique concrète must hide the source of its sounds and became a model for field recording, soundscape composition and ambient music. It connects Schaeffer's studio methods with Schafer's acoustic ecology and with Cage's belief that everyday sound is music.",
radigue:"Éliane Radigue, born in Paris in 1932, worked in Pierre Schaeffer's studio and assisted Pierre Henry before developing her own style in the late 1960s, using tape feedback and then an ARP 2500 synthesiser to create slow, shifting drones. Her pieces change so gradually that listeners notice details only after long attention, which suits her practice as a Tibetan Buddhist, begun in the 1970s. Her Trilogie de la Mort, completed in the early 1990s, was inspired by the Tibetan Book of the Dead. After 2001 she began composing for acoustic performers, working directly with them by ear. Radigue's music links electronic technology, meditation and listening, and it offers a counterweight to music based on speed and spectacle.",
kraft:"Kraftwerk, formed in Düsseldorf in 1970 by Ralf Hütter and Florian Schneider, made electronic music into pop with albums such as Autobahn in 1974, Trans-Europe Express in 1977 and The Man-Machine in 1978. They built custom instruments and presented themselves as men blending with machines, in a deliberately cool, precise style. Around the same time in Munich, the producer Giorgio Moroder created Donna Summer's I Feel Love in 1977, with an almost entirely synthesised backing. Together they shaped disco, synth-pop, hip-hop and techno: Afrika Bambaataa's Planet Rock in 1982 borrowed from Kraftwerk. Their work reflects Germany's postwar reinvention and the idea of technology as a creative partner.",
midi:"MIDI, short for Musical Instrument Digital Interface, is a standard agreed in 1983 that lets electronic instruments and computers communicate. Developed by engineers including Dave Smith of Sequential Circuits and Ikutaro Kakehashi of Roland, it was publicly demonstrated in January 1983 when a Prophet 600 and a Jupiter 6 were connected. MIDI does not transmit sound; it sends instructions such as which note to play, how hard and for how long, so one keyboard can control many devices and a sequencer can record performances as editable data. The format is still in use, with an updated version launched in 2020. It is a descendant of the player piano roll, and an example of open standards enabling an entire industry.",
