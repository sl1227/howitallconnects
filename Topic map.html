newspaper:"The first regular printed newspaper is usually considered to be the Relation, published in Strasbourg in 1605 by Johann Carolus, who had previously sold handwritten news sheets to subscribers. Earlier, the Venetian avvisi had circulated news among merchants, and other German and Dutch periodicals soon followed. London's Daily Courant appeared in 1702, and the steam press and the telegraph in the nineteenth century made newspapers cheaper, faster and more widely read. They built the public sphere, supported political debate in coffeehouses and fuelled revolutions and propaganda. Governments responded with taxes and censorship. Newspapers show how printing created a regular, shared public conversation, and the changes of the internet era echo these earlier shifts.",
extinct:"Until the late eighteenth century most naturalists assumed that no species could vanish, because creation was thought to be complete. In 1796 the French anatomist Georges Cuvier showed that fossil bones of mammoths and mastodons differed from living elephants, and argued that species had been lost in great catastrophes. Later scientists identified five mass extinctions, such as the end-Permian event about 252 million years ago, which wiped out an estimated ninety per cent of marine species, and the end-Cretaceous one 66 million years ago, linked to an asteroid impact by Luis and Walter Alvarez in 1980. Today many scientists warn of a sixth extinction driven by habitat loss and climate change. The topic links Darwin, ecology and deforestation.",
pavlov:"Ivan Pavlov, a Russian physiologist who won the 1904 Nobel Prize for his work on digestion, noticed that dogs began to salivate when they saw the assistants who fed them. Around 1897 to 1903 he began systematic experiments, pairing a neutral cue such as a bell or metronome with food until the cue alone triggered salivation, a process called classical conditioning. It showed that learning could be studied objectively, and it influenced behaviourism, developed by John B. Watson from 1913. Conditioning ideas were applied in advertising, education and therapy, and they raise ethical questions about manipulation. Pavlov's work links psychology to physiology and to the study of how habits and associations form, as in brand loyalty and social media.",
astrolabe:"The astrolabe is a portable instrument that models the sky on a flat disc, allowing users to measure the altitude of the Sun or stars, tell the time, find the direction of Mecca and solve problems in astronomy. Its principles were known to the Greeks, including Hipparchus and Ptolemy, and Islamic scholars refined it from the eighth century, producing finely engraved brass instruments. The tenth-century Aleppo craftswoman Mariam al-Asturlabi is among the known makers. Astrolabes reached Europe through Spain, and Geoffrey Chaucer wrote an English guide to using one in 1391. Mariners used simplified versions in the fifteenth century, until the sextant replaced them in the eighteenth. The device joins geometry, astronomy and navigation, and fits the story of knowledge travelling through the Islamic world.",
qwerty:"The QWERTY keyboard layout was developed by Christopher Latham Sholes, who patented a typewriter in 1868, and was commercialised by the arms manufacturer Remington from 1873. The arrangement is often said to have been designed to keep commonly paired letters apart so that typebars would not jam, though historians dispute the details. Alternative layouts such as August Dvorak's of 1936 promise faster typing, but QWERTY persisted because millions of people had already learned it, an example of path dependence. The same layout carried over to teleprinters, computers and phone screens. Typewriters changed offices and employment, giving many women new jobs, and the keyboard connects the history of writing, telegraphy and the computer interface.",
jeans:"Blue jeans were born in 1873 when Jacob Davis, a tailor in Nevada, and the dry-goods merchant Levi Strauss patented a method of strengthening work trousers with copper rivets at the stress points. The fabric was denim, originally a hard-wearing cotton twill from Nîmes in France, dyed with indigo, which fades distinctively with wear. Jeans were first sold to miners, farmers and cowboys. In the 1950s, films such as Rebel Without a Cause turned them into a symbol of youth rebellion, and they spread worldwide as casual clothing. Their production links synthetic indigo, sewing machines and global supply chains, and their environmental impact, from water use to dyeing waste, makes them a case study of consumer culture.",
chocolate:"Cacao was used in Mesoamerica for thousands of years, and archaeologists have found traces of it from about 1900 BCE. The Maya and Aztecs prepared it as a bitter, frothy drink, often flavoured with chilli, and cacao beans served as currency. After Hernán Cortés encountered the drink at the court of Moctezuma in 1519, Spaniards added sugar and took it to Europe, where chocolate houses became fashionable in the seventeenth century. Coenraad van Houten's press of 1828 produced cocoa powder, and solid eating chocolate was made by J. S. Fry and Sons in 1847, followed by milk chocolate in the 1870s. Today much cocoa is grown in West Africa, where child labour and deforestation are serious concerns, connecting chocolate to the Columbian Exchange, sugar and empire.",
bookkeeping:"Double-entry bookkeeping records every transaction twice, as a debit in one account and a credit in another, so that the books always balance and errors can be detected. Merchants in Italian cities such as Genoa and Florence were using the method by the fourteenth century, and in 1494 the mathematician Luca Pacioli, in his book Summa de arithmetica, published in Venice, described it in a section that spread the technique across Europe. The system gave businesses a clear picture of assets and profits, and supported the growth of banks, joint-stock companies and later accountancy. Pacioli also wrote about the golden ratio, with illustrations by Leonardo. Bookkeeping is a quiet example of how a method of recording can shape economic life, in a way comparable with writing.",
sewers:"In the hot summer of 1858 the stench from the River Thames, which had become an open sewer, was so bad that Parliament was forced to act, an event known as the Great Stink. The engineer Joseph Bazalgette designed a system of intercepting sewers, completed between 1859 and 1875, which carried waste eastwards, away from the centre, along with embankments such as the Victoria Embankment. Cholera outbreaks, including that of 1854 traced by John Snow to a pump in Soho, had shown the link between contaminated water and disease, though many still blamed bad air. Paris under Haussmann had also built extensive sewers. The projects improved public health greatly and are a reminder that industrial cities depended on hidden infrastructure.",
semmelweis:"In 1847 the Hungarian doctor Ignaz Semmelweis, working at the Vienna General Hospital, noticed that deaths from childbed fever were much higher in the ward staffed by doctors and medical students, about ten per cent, than in the ward staffed by midwives, about four per cent. He realised that the doctors, who also performed autopsies, were carrying something on their hands, and he ordered them to wash with a chlorinated lime solution, after which mortality fell to around two per cent. Many colleagues rejected his findings, and he lost his post and died in an asylum in 1865. Pasteur's germ theory and Lister's antisepsis later vindicated him. His story illustrates how evidence can be resisted when it challenges professional habit, as in Kuhn's account.",
};

const gn = t => t.replace(/^\d+\s+/,"");
const SAMPLE = (()=>{
  const items = RAW.trim().split("\n").map(l=>{const [id,group,when,name,desc]=l.split("|");return {id,group,when:+when,name,desc};});
  const links = LINKS.trim().split(/\s+/).map(s=>s.split(">"));
  return {title:"How it all connects", groups:GROUPS, items, links};
})();

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
let data = SAMPLE, L = null, sel = null, selG = null, tx = 0, ty = 0, k = 1;
try { const s = localStorage.getItem("topicmap20"); if (s) data = validate(JSON.parse(s)); } catch (e) { data = SAMPLE; }

function validate(d){
  if(!d || !Array.isArray(d.groups) || !Array.isArray(d.items)) throw new Error("Data needs a groups list and an items list.");
  const gids = new Set(d.groups.map(g=>g.id)), ids = new Set();
  d.items.forEach((it,i)=>{
    if(!it.id || !it.name) throw new Error("Item "+(i+1)+" needs an id and a name.");
    if(ids.has(it.id)) throw new Error("Duplicate id: "+it.id);
    ids.add(it.id);
    if(!gids.has(it.group)) throw new Error('Item "'+it.name+'" uses a group that is not in the groups list.');
  });
  d.links = (d.links||[]).filter(l=>Array.isArray(l) && ids.has(l[0]) && ids.has(l[1]));
  return d;
}
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const a in attrs) e.setAttribute(a, attrs[a]);
  if (parent) parent.appendChild(e);
  return e;
}

function layout(){
  let seed = 7; const rnd = () => (seed = seed*16807 % 2147483647)/2147483647;
  const gs = data.groups, gi = {}; gs.forEach((g,i)=>gi[g.id]=i);
  const C = gs.map((g,i)=>{ const a = i*2.4, r = 250*Math.sqrt(i+.6); return {x:Math.cos(a)*r, y:Math.sin(a)*r}; });
  const map = {};
  const nodes = data.items.map(it=>{
    const c = C[gi[it.group]];
    const n = {it, g:gs[gi[it.group]], c, x:c.x+(rnd()-.5)*180, y:c.y+(rnd()-.5)*180, vx:0, vy:0, deg:0};
    map[it.id] = n; return n;
  });
  const ed = data.links.map(([a,b])=>{ map[a].deg++; map[b].deg++; return [map[a], map[b]]; });
  const T = 420;
  for (let t=0; t<T; t++){
    const al = 1 - t/T;
    for (let i=0; i<nodes.length; i++){
      const a = nodes[i];
      a.vx += (a.c.x-a.x)*.014*al; a.vy += (a.c.y-a.y)*.014*al;
      for (let j=i+1; j<nodes.length; j++){
        const b = nodes[j], dx = a.x-b.x, dy = a.y-b.y, d2 = dx*dx+dy*dy+.1;
        if (d2 < 26000){ const d = Math.sqrt(d2), f = 1500/(d2*d); a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f; }
      }
    }
    ed.forEach(([a,b])=>{
      const dx = b.x-a.x, dy = b.y-a.y, d = Math.sqrt(dx*dx+dy*dy)+.01, f = (d-100)*.012*al/d;
      a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f;
    });
    nodes.forEach(n=>{ n.x += n.vx; n.y += n.vy; n.vx *= .55; n.vy *= .55; });
  }
  const groups = gs.map(g=>{
    const m = nodes.filter(n=>n.g===g); if(!m.length) return {g,n:0};
    const x = m.reduce((s,n)=>s+n.x,0)/m.length, y = m.reduce((s,n)=>s+n.y,0)/m.length;
    return {g, n:m.length, x, y, r:Math.max(...m.map(n=>Math.hypot(n.x-x,n.y-y)))+34};
  });
  const live = groups.filter(h=>h.n);
  const b = {x0:Math.min(...live.map(h=>h.x-h.r)), x1:Math.max(...live.map(h=>h.x+h.r)), y0:Math.min(...live.map(h=>h.y-h.r-30)), y1:Math.max(...live.map(h=>h.y+h.r))};
  return {nodes, map, ed, groups, b};
}

function draw(){
  $("title").textContent = data.title || "Topic map";
  document.title = $("title").textContent;
  L = layout();
  const g = $("g"); g.innerHTML = "";
  L.groups.forEach(h=>{
    if(!h.n) return;
    const c0 = el("circle",{cx:h.x,cy:h.y,r:h.r,fill:h.g.color,"fill-opacity":.06,stroke:h.g.color,"stroke-opacity":.35,"stroke-width":1.2,"stroke-dasharray":"5 5"},g); c0.style.cursor="pointer"; c0.addEventListener("click",()=>{ if(!moved) selectGroup(h.g.id); });
    const t = el("text",{x:h.x,y:h.y-h.r-8,class:"glabel"},g); t.textContent = gn(h.g.name); t.addEventListener("click",()=>{ if(!moved) selectGroup(h.g.id); });
  });
  const lg = el("g",{},g);
  L.ed.forEach(([a,b])=>{
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y;
    el("path",{d:`M${a.x} ${a.y} Q${mx-dy*.1} ${my+dx*.1} ${b.x} ${b.y}`,class:"link","data-a":a.it.id,"data-b":b.it.id},lg);
  });
  L.nodes.forEach(n=>{
    const ng = el("g",{class:"node"+(n.deg>=5?" hub":""),tabindex:0,role:"button","aria-label":n.it.name,"data-id":n.it.id},g);
    const r = 2.2 + Math.min(n.deg,8)*.35;
    el("circle",{cx:n.x,cy:n.y,r:r+6,class:"hit"},ng);
    el("circle",{cx:n.x,cy:n.y,r,fill:n.g.color},ng);
    const t = el("text",{x:n.x+r+3,y:n.y+4},ng); t.textContent = n.it.name;
    ng.addEventListener("click",()=>{ if(!moved) select(n.it.id); });
    ng.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); select(n.it.id); }});
  });
  if (sel && !L.map[sel]) sel = null;
  mark(); fit();
}

function mark(){
  const rel = new Set(sel ? [sel] : []);
  document.querySelectorAll(".link").forEach(p=>{
    const a = p.dataset.a, b = p.dataset.b, on = sel && (a===sel || b===sel);
    const ing = selG && L.map[a].it.group===selG && L.map[b].it.group===selG;
    p.classList.toggle("on", !!(on||ing));
    p.classList.toggle("dim", !!(sel||selG) && !(on||ing));
    if (on) { rel.add(a); rel.add(b); }
  });
  document.querySelectorAll(".node").forEach(n=>{
    const id = n.dataset.id, ing = selG && L.map[id].it.group===selG;
    n.classList.toggle("sel", id===sel);
    n.classList.toggle("rel", rel.has(id) || !!ing);
    n.classList.toggle("dim", !!(sel||selG) && !rel.has(id) && !ing);
  });
}
function selectGroup(id){
  sel = null; selG = id; mark();
  const gr = L.groups.find(h=>h.g.id===id); if(!gr || !gr.n) return;
  const p = $("panel"); p.innerHTML = "";
  const add = (tag, txt, cls) => { const e = document.createElement(tag); e.textContent = txt; if(cls) e.className = cls; p.appendChild(e); return e; };
  add("h2", gn(gr.g.name));
  const c = add("span", gr.n+" topics", "chip"); c.style.background = gr.g.color;
  if (data===SAMPLE && GINFO[id]) add("p", GINFO[id]);
  add("div", "Oldest to newest", "muted");
  const r = document.createElement("div"); r.className = "rel";
  L.nodes.filter(n=>n.g===gr.g).sort((a,b)=>(a.it.when||0)-(b.it.when||0)).forEach(n=>{ const b = document.createElement("button"); b.textContent = n.it.name; b.style.borderLeft = "4px solid "+gr.g.color; b.onclick = ()=>select(n.it.id); r.appendChild(b); });
  p.appendChild(r);
  const rc = svg.getBoundingClientRect();
  k = Math.min(rc.width, rc.height)/(gr.r*2+70); tx = rc.width/2 - gr.x*k; ty = rc.height/2 - gr.y*k; apply();
}

function select(id){
  sel = id; selG = null; mark();
  const n = L.map[id], p = $("panel"); p.innerHTML = "";
  const add = (tag, txt, cls) => { const e = document.createElement(tag); e.textContent = txt; if(cls) e.className = cls; p.appendChild(e); return e; };
  add("h2", n.it.name);
  const c = add("span", gn(n.g.name), "chip"); c.style.background = n.g.color;
  if (typeof n.it.when === "number") add("div", "Around " + n.it.when, "muted");
  add("p", (typeof LONG!=="undefined" && data===SAMPLE && LONG[id]) || n.it.desc || "No description yet. Add one in Edit topics.");
  const nb = [];
  L.ed.forEach(([a,b])=>{ if(a===n) nb.push(b); else if(b===n) nb.push(a); });
  if (nb.length){
    const s = add("div", "Connected to "+nb.length+" items", "muted"); s.style.marginTop = "12px";
    const r = document.createElement("div"); r.className = "rel";
    r.className = "rel why"; nb.forEach(m=>{ const row = document.createElement("div"), b = document.createElement("button"), w = document.createElement("small"); b.textContent = m.it.name; b.style.borderLeft = "4px solid "+m.g.color; b.onclick = ()=>select(m.it.id); const why = WHY[id+">"+m.it.id] || WHY[m.it.id+">"+id]; w.textContent = why || "No specific reason recorded for this link yet."; if(!why) w.className = "muted"; row.append(b, w); r.appendChild(row); });
    p.appendChild(r);
  }
  const rc = svg.getBoundingClientRect();
  k = Math.max(k, 1.2); tx = rc.width/2 - n.x*k; ty = rc.height/2 - n.y*k; apply();
}

function apply(){ $("g").classList.toggle("zoomed",k>=1.3); $("g").setAttribute("transform",`translate(${tx} ${ty}) scale(${k})`); }
function fit(){
  const r = svg.getBoundingClientRect(), b = L.b, w = b.x1-b.x0, h = b.y1-b.y0;
  k = Math.min(r.width/(w+40), r.height/(h+40));
  tx = r.width/2 - (b.x0+w/2)*k; ty = r.height/2 - (b.y0+h/2)*k; apply();
}
function zoomAt(f, cx, cy){
  const nk = Math.min(6, Math.max(.1, k*f)), r = nk/k;
  tx = cx - (cx - tx)*r; ty = cy - (cy - ty)*r; k = nk; apply();
}
const svg = $("svg"); let drag = null, moved = false;
svg.addEventListener("pointerdown",e=>{ drag = {x:e.clientX,y:e.clientY,tx,ty}; moved = false; });
window.addEventListener("pointermove",e=>{
  if(!drag) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  if (Math.abs(dx)+Math.abs(dy) > 4) { moved = true; svg.classList.add("drag"); }
  if (moved) { tx = drag.tx+dx; ty = drag.ty+dy; apply(); }
});
window.addEventListener("pointerup",()=>{ drag = null; svg.classList.remove("drag"); setTimeout(()=>moved=false,0); });
svg.addEventListener("wheel",e=>{
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(e.deltaY<0?1.12:1/1.12, e.clientX-r.left, e.clientY-r.top);
},{passive:false});
svg.addEventListener("click",e=>{ if(e.target===svg && !moved){ sel = null; selG = null; mark(); $("panel").innerHTML = '<p class="muted">Select an item on the map to read about it.</p>'; }});
function center(){ const r = svg.getBoundingClientRect(); return [r.width/2, r.height/2]; }
$("zin").onclick = ()=>zoomAt(1.3,...center());
$("zout").onclick = ()=>zoomAt(1/1.3,...center());
$("zfit").onclick = fit;
window.addEventListener("resize",fit);
$("q").addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  const v = e.target.value.trim().toLowerCase();
  const n = v && L.nodes.find(n=>n.it.name.toLowerCase().includes(v));
  if (n) select(n.it.id);
});

const dlg = $("dlg");
$("edit").onclick = ()=>{ $("json").value = JSON.stringify(data,null,2); $("err").textContent = ""; dlg.showModal(); };
$("cancel").onclick = ()=>dlg.close();
$("reset").onclick = ()=>{ $("json").value = JSON.stringify(SAMPLE,null,2); $("err").textContent = ""; };
$("apply").onclick = ()=>{
  try {
    data = validate(JSON.parse($("json").value));
    try { localStorage.setItem("topicmap20", JSON.stringify(data)); } catch (e) {}
    sel = null; selG = null; $("panel").innerHTML = '<p class="muted">Select an item on the map to read about it.</p>';
    draw(); dlg.close();
  } catch (e) { $("err").textContent = e.message; }
};
draw();
</script>
</body>
