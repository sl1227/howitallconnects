scriab:"Alexander Scriabin, the Russian composer and pianist, wrote Prometheus: The Poem of Fire in 1910 with a part for a colour organ, or luce, an instrument that would project coloured light in step with the music. He believed in correspondences between keys and colours, and some accounts describe him as a synaesthete, though scholars debate how consistent his associations were. The first performance in Moscow in 1911 took place without the light part, and the work was staged with coloured lighting in New York in 1915. Scriabin's mystical ambitions anticipated multimedia art, light shows and film music, and he was admired by Kandinsky and the Russian avant-garde, who were also exploring links between sound, colour and abstraction.",
sampl:"Hip-hop sampling grew out of the Bronx in the 1970s, where DJs such as Kool Herc extended the drum breaks of funk records by switching between two copies on turntables. Producers began to loop and layer fragments, a practice that became easier with samplers such as the Fairlight CMI in 1979, the E-mu Emulator in 1981 and the Akai MPC in 1988. Groups like Public Enemy built dense collages from dozens of recordings. Legal conflict followed: a 1991 US court ruling against Biz Markie established that unlicensed samples could be infringement, and clearance became a major cost. Sampling revived the idea of musique concrète on the street, treating recorded sound as raw material and questioning ownership in music.",
eno:"Brian Eno, born in 1948, left Roxy Music in 1973 and became a leading figure in experimental pop, production and ambient music. His 1978 album Ambient 1: Music for Airports defined the genre as music that rewards attention but can also be ignored, designed to shape the atmosphere of a space. He built on Erik Satie's furniture music and tape techniques, and with the painter Peter Schmidt created Oblique Strategies, a deck of cards offering creative prompts. Eno later explored generative music, in which systems produce endless variations, including software such as Bloom. He produced David Bowie, Talking Heads and U2, and his thinking links listening, chance, technology and environment, bridging avant-garde ideas and popular culture.",
cage:"John Cage's 4'33\" was first performed on 29 August 1952 in Woodstock, New York, by the pianist David Tudor, who sat at the piano and marked three movements by closing and opening the lid without playing. The sounds of the wind, the rain on the roof and the audience's reactions became the music. Cage had been struck by a visit in 1951 to an anechoic chamber at Harvard, where he still heard two sounds, which he understood as his nervous system and his blood circulation: silence did not exist. Influenced by Zen Buddhism and by chance methods drawn from the I Ching, he argued that listening makes music. The piece anticipated sound art, soundscape studies and mindfulness.",
lantern:"The magic lantern was an early projector that used a lamp and lens to throw images painted on glass slides onto a wall or screen. Christiaan Huygens sketched a version in the 1650s, and Athanasius Kircher had described similar devices earlier. It became a popular form of entertainment, education and religious instruction, and travelling showmen used it for lectures. In the 1790s Paul Philidor and Étienne-Gaspard Robertson staged phantasmagoria shows in Paris, using moving lanterns and smoke to make ghosts appear to float through the room. Later developments added dissolving views and moving slides. The lantern prepared audiences to sit in the dark watching projected images, which is why it is considered a direct ancestor of cinema.",
zoe:"The zoetrope is a spinning drum with slits around its sides and a strip of drawings inside, which appear to move when viewed through the slits as the drum turns. William Horner described the principle in 1834, and it was patented and sold widely in the 1860s. It followed the phenakistiscope of the early 1830s, invented independently by Joseph Plateau and Simon von Stampfer. These toys exploited the way the eye and brain join rapid sequences of images into smooth motion, an effect traditionally called persistence of vision, though modern researchers prefer other explanations. They were the first popular animation devices and taught audiences to expect moving pictures, leading toward Muybridge, Marey and the Lumière brothers.",
photo:"Early photography began when Nicéphore Niépce made the earliest surviving camera image, a view from his window, in about 1826 or 1827. Louis Daguerre developed a faster process, and in 1839 the French government announced the daguerreotype, a unique, highly detailed image on a silvered copper plate. At about the same time, William Henry Fox Talbot in Britain perfected a negative-and-positive paper process that allowed many prints to be made from one exposure. Photography changed painting, which no longer needed to record likeness, and it gave science a new way to document evidence. It also made the idea of mechanical reproduction central to modern culture, and it provided the technical basis for stereoscopes, chronophotography and film.",
wag:"Gesamtkunstwerk, or total artwork, was a term popularised by Richard Wagner in his 1849 essay The Artwork of the Future. He argued that music, poetry, drama, painting and architecture should be fused into a single work, as he believed they had been in ancient Greek theatre. At the Bayreuth Festspielhaus, opened in 1876, he put the idea into practice with a darkened auditorium, a hidden orchestra pit and a stage designed to absorb the audience. The ideal inspired the Bauhaus, Kandinsky and Scriabin, and it anticipated cinema and immersive installations. Wagner's antisemitism and later use of his work by the Nazis complicate his legacy, and critics see the total work as a model for manipulation as well as wonder.",
stereo:"The stereoscope shows two photographs taken from slightly different viewpoints, one to each eye, so that the brain combines them into a single image with depth. Charles Wheatstone invented it in 1838, using mirrors, and David Brewster introduced a lens version in 1849. It was a sensation at the Great Exhibition of 1851, and when Oliver Wendell Holmes designed a simple handheld viewer in 1861, stereo cards became a mass medium, with millions sold for parlour entertainment, travel and education. Stereoscopy shows that vision is constructed from two flat inputs, and it prepared the ground for 3D cinema, the View-Master of 1939 and virtual reality headsets, which use the same principle.",
muy:"In 1878 the photographer Eadweard Muybridge, working for the former governor Leland Stanford, set up a row of cameras triggered by tripwires along a racetrack at Palo Alto to photograph a galloping horse. The images showed that at one moment all four hooves are off the ground, but not in the extended pose shown by painters. Muybridge went on to publish Animal Locomotion in 1887 and invented the zoopraxiscope to project his sequences. The French physiologist Étienne-Jules Marey developed a chronophotographic gun in 1882 that recorded several phases on one plate. Their work turned photography into a scientific instrument for analysing motion and led directly to the invention of cinema.",
fuller:"Loïe Fuller was an American dancer who became a sensation in Paris with her Serpentine Dance, first performed in 1892. She wore vast skirts of silk and used long wands to turn the fabric into flowing shapes, lit by coloured electric lights that she experimented with and patented. Appearing at the Folies Bergère and the 1900 Exposition, she was celebrated by Symbolist poets and Art Nouveau artists, and she was filmed by early cinematographers, who often hand-coloured the results. She befriended scientists such as Marie Curie and was fascinated by radium and light. Fuller connects dance, technology, electric light and early film, and she is a model of how performance could become a kind of moving image.",
lum:"Auguste and Louis Lumière, who ran a photographic plate factory in Lyon, patented their Cinématographe in February 1895. It combined camera, film printer and projector in a light, hand-cranked box, which made it practical to film outdoors and show the results to audiences. The first public screening to a paying audience took place on 28 December 1895 at the Grand Café in Paris, with short films such as Workers Leaving the Lumière Factory, each lasting under a minute. Their films recorded everyday scenes with a fixed camera, and operators were sent around the world to film and exhibit. Though the brothers reportedly thought cinema had little future, it spread quickly and began a new industry.",
mel:"Georges Méliès was a Parisian stage magician who attended the Lumière screening in 1895 and bought a camera soon after. He built a glass-roofed studio at Montreuil and discovered that stopping the camera, changing the scene and starting again made objects vanish or transform. He combined this with multiple exposures, dissolves and hand-coloured film in over five hundred short films, including A Trip to the Moon in 1902, with its famous image of a rocket in the Moon's eye. While the Lumières showed reality, Méliès staged fantasy, establishing the idea that cinema can create worlds. Competition and the First World War ruined him, but he was rediscovered by the 1920s, and Martin Scorsese's film Hugo celebrated his story.",
kelly:"The Story of the Kelly Gang, released in Australia in December 1906, is widely regarded as the world's first feature-length narrative film. It dramatised the career of the bushranger Ned Kelly, who was hanged in 1880 and had become a symbol of defiance. Directed by Charles Tait and produced by the Tait brothers, it originally ran for more than an hour, accompanied by lectures, sound effects and live music. It was a huge commercial success, though some authorities worried about glamorising outlaws, and several states restricted bushranger films. Only fragments survive, about seventeen minutes, but they were recognised by UNESCO in its Memory of the World register in 2007. The film shows how local stories and the new medium fused in a national mythology.",
rutt:"Walter Ruttmann was a German painter and filmmaker who made some of the first abstract animations, beginning with Lichtspiel Opus 1 in 1921, in which coloured shapes move to a live musical score. He later made Berlin: Symphony of a Metropolis in 1927, a city portrait organised by rhythm and editing rather than narrative. In 1930 he produced Weekend, a radio piece recorded on optical film as a collage of sounds without images, which anticipates musique concrète. In the 1930s he worked on propaganda films for the Nazi regime, and he died in 1941 after an injury on the Eastern Front. Ruttmann links painting, abstraction, montage and sound, and he treated film as visual music.",
silent:"The era of silent film ran from the mid-1890s until the late 1920s, although the films were rarely silent in practice. Cinemas hired pianists, organists or full orchestras to accompany them, and some used sound effects or narrators, while intertitles carried dialogue and plot. The period produced comic geniuses such as Charlie Chaplin and Buster Keaton, and epics including D. W. Griffith's The Birth of a Nation (1915), a technically influential but racist film. Soviet directors such as Sergei Eisenstein developed montage theory in Battleship Potemkin (1925), and Fritz Lang's Metropolis (1927) imagined a mechanised future. Because many silent films have been lost or edited, the period remains a rich field for restoration and rediscovery.",
hollyw:"Sound film became commercially decisive in October 1927 with The Jazz Singer, produced by Warner Bros., which paired a synchronised disc system, Vitaphone, with spoken and sung moments. Lights of New York in 1928 was the first all-talking feature, and by the early 1930s most studios had converted to sound, often using optical soundtracks printed on the film itself. The change altered film language and the industry: actors had to be audible, cameras were muffled in soundproof booths, and many silent stars faded. In 1928 Eisenstein and others argued that sound should counterpoint images rather than simply illustrate them. The arrival of sound also gave composers, sound designers and eventually electronic musicians a permanent place in cinema.",
sky:"The Home Insurance Building in Chicago, designed by William Le Baron Jenney and finished in 1885, is often called the first skyscraper because it used a metal skeleton to carry the weight of the building, with walls hung from the frame. Chicago was rebuilding after the great fire of 1871, land was expensive, and Elisha Otis's safety elevator, demonstrated in 1853, made tall buildings practical. Architects of the Chicago School, including Daniel Burnham, John Root and Louis Sullivan, refined the type with large windows and steel frames. The skyscraper symbolised commercial ambition and the machine age, and it set the pattern for the vertical cities of the twentieth century in New York, Shanghai and beyond.",
sull:"Louis Sullivan, a Chicago architect, published The Tall Office Building Artistically Considered in 1896, an essay containing the principle that form ever follows function. He meant that the shape of a building should express its purpose, and that nature, from eagles to oak trees, offers examples of form following use. His Wainwright Building in St. Louis of 1891 emphasised vertical lines and rich organic ornament, and he mentored the young Frank Lloyd Wright. Later modernists shortened the phrase into a slogan for stripping away decoration, which Sullivan himself did not do, since his own buildings were lavishly ornamented. The idea links the skyscraper to the Bauhaus, to biomimicry and to design philosophies that treat efficiency as beauty.",
bau:"The Bauhaus was a German school of art, craft and design founded in Weimar in 1919 by the architect Walter Gropius, with the aim of uniting fine art, handcraft and industrial production. It moved to Dessau in 1925, where Gropius designed its landmark building, and to Berlin in 1932, before closing in 1933 under Nazi pressure. Teachers included Wassily Kandinsky, Paul Klee, László Moholy-Nagy, Josef Albers and Marcel Breuer. Students began with a preliminary course exploring materials, colour and form, and went on to make furniture, textiles, typography and buildings. Émigré teachers carried its ideas to the United States and elsewhere, shaping modern design, education and the look of everyday objects.",
moholy:"László Moholy-Nagy was a Hungarian artist who joined the Bauhaus in 1923 and led its metal workshop and preliminary course. He championed what he called the New Vision, using photograms, unusual camera angles and film to see the world differently, and he argued that familiarity with the camera would be essential for modern literacy. His Light Space Modulator of 1930 was a kinetic sculpture that created moving patterns of light and shadow. He also experimented with scratching marks onto gramophone records to produce new sounds. After the Nazis closed the Bauhaus he moved to Britain and then to Chicago, where he founded the New Bauhaus in 1937. His career links photography, film, sound, design and teaching.",
frank:"The Frankfurt Kitchen, designed in 1926 by the Austrian architect Margarete Schütte-Lihotzky for the city's social housing programme under Ernst May, was a compact, fitted kitchen of only a few square metres. It drew on Frederick Taylor's studies of efficient movement and on the layout of railway dining cars, with everything within reach, aluminium storage bins, a fold-down ironing board and a sliding door to the living room. About ten thousand were installed in new apartments. Supporters saw it as liberating women from drudgery, while critics said it confined them to the kitchen and treated housework as factory work. The kitchen is an influential example of applying industrial methods to domestic life, and a forerunner of the modern fitted kitchen.",
glassbox:"The International Style takes its name from the 1932 exhibition at the Museum of Modern Art in New York organised by Henry-Russell Hitchcock and Philip Johnson. It described a type of architecture with steel frames, flat roofs, glass curtain walls, open plans and no ornament, associated with Le Corbusier, Walter Gropius and Ludwig Mies van der Rohe. Later landmarks such as Lever House (1952) and the Seagram Building (1958) made the glass box a symbol of corporate modernism around the world. Critics argued that identical buildings ignored climate, culture and place, and that fully glazed towers are expensive to heat and cool. The style nevertheless defined the look of twentieth-century cities and prompted the later reaction known as postmodernism.",
sub:"Postwar suburbs expanded rapidly after 1945, helped by cheap mortgages, new highways and car ownership. Levittown on Long Island, begun in 1947 by William Levitt, built thousands of near-identical houses using assembly-line methods, with crews completing a standard task at each lot. In the United States, the GI Bill and federal mortgage insurance made home ownership possible for millions of veterans, though racial covenants and discriminatory lending largely excluded Black families. Suburbs reflected the consumerist ideal of a private house, lawn and appliances, and similar patterns spread to Australia and elsewhere. Critics point to car dependence, environmental cost and social segregation, making suburbia a key case in how mass production shaped everyday life.",
pj:"Philip Johnson was an American architect and curator who helped introduce European modernism to the United States as the first head of the architecture department at the Museum of Modern Art. He co-organised the 1932 International Style exhibition, designed the transparent Glass House in New Canaan in 1949, and in 1979 received the first Pritzker Architecture Prize. In 1984 his AT&T Building in New York, with its broken-pedimented top, was a defining moment of postmodern architecture, bringing historical references back after decades of austere modernism. His career was also marked by an earlier association with fascist politics in the 1930s, which he later acknowledged as a mistake. Johnson shows how a single figure could both promote and undermine a style.",
corb:"Le Corbusier, born Charles-Édouard Jeanneret in Switzerland in 1887, was one of the most influential architects and planners of the twentieth century. His 1923 book Vers une architecture declared the house a machine for living in, and he set out five points of modern architecture: raised columns, a free plan, a free façade, ribbon windows and a roof garden, seen in the Villa Savoye of 1931. In 1948 he introduced the Modulor, a proportional system based on the human figure and the golden ratio. He proposed radical city plans and designed Chandigarh in India in the 1950s. Critics say his sweeping urban schemes ignored existing communities, but his ideas shaped housing, planning and design worldwide.",
gaudi:"Antoni Gaudí, a Catalan architect, spent more than forty years on the Sagrada Família in Barcelona, which he took over in 1883 and which is still under construction after his death in 1926. He drew on nature, using branching columns that resemble trees, and on structural experiments such as hanging chains weighted with bags to find the shapes of arches under pure compression, then turning the model upside down. He used curves, helicoids and hyperboloids instead of right angles, and decorated surfaces with broken tile mosaics, as in Park Güell and Casa Batlló. Often seen as a forerunner of biomimicry, Gaudí combined craft, geometry and faith, offering an alternative to the machine aesthetic of the Bauhaus.",
recode:"Eastern thought was repeatedly recoded for Western audiences from the nineteenth century onwards. Max Müller's Sacred Books of the East, published from 1879, translated Indian and Chinese texts into English, but through the assumptions of European scholarship. Swami Vivekananda's address to the 1893 Parliament of the World's Religions in Chicago presented Hindu ideas as a universal philosophy, while Theosophists and later D. T. Suzuki presented Buddhism and Zen as rational, mystical or compatible with science. Edward Said's Orientalism of 1978 argued that such framing often portrayed the East as timeless and spiritual in contrast with a rational West. The process gave Eastern ideas a global audience but also flattened them, which matters when they are used to critique Western science.",
sciencemyth:"Calling science a mythology does not mean calling it false. In this sense a myth is a story that organises experience and gives it meaning, and critics such as Roland Barthes in Mythologies (1957) and Mary Midgley in Science as Salvation (1992) argue that popular science often carries stories of inevitable progress, objective detachment and humans mastering nature. Paul Feyerabend likewise questioned the idea of a single scientific method. Defenders respond that science differs because its claims can be tested and revised. The comparison is useful because it asks which stories about the universe, such as the clockwork machine or the selfish gene, shape what we look for and what we ignore, and how they compare with the myths of other cultures.",
logos:"Logos and mythos are Greek terms for two ways of speaking. Mythos is story, handed down through poetry and ritual, while logos is reasoned argument and account. A well-known narrative, associated with the historian Wilhelm Nestle's 1940 book, describes Greek thought as moving from mythos to logos, as the Presocratic philosophers sought natural explanations instead of divine ones. Many scholars now regard this as too simple, since Plato himself told myths and early science used imagery. Karen Armstrong has argued that the two were once seen as complementary, with myth addressing meaning and logos practical matters. The distinction is central to debates about how Western education ranks reason above story, and how other cultures balance them.",
cyclic:"Many traditions describe time as cyclical rather than a straight line from creation to an end. Hindu texts speak of vast ages, or yugas, which repeat in grand cycles called kalpas. Buddhism describes the cycle of rebirth, samsara, from which liberation is sought. The Maya tracked overlapping calendar cycles, and Greek thinkers such as the Stoics imagined the world periodically renewed. The historian of religion Mircea Eliade, in The Myth of the Eternal Return (1949), argued that archaic societies understood events as repeating sacred patterns. This contrasts with the Judeo-Christian and Enlightenment picture of linear time and progress, and with modern ideas of endless growth. It resonates with ecological cycles of seasons, decay and renewal.",
lotus:"The lotus has two stories on this map. In Buddhist and Hindu imagery it is a symbol of purity and awakening, because it rises from muddy water and opens clean and unstained. In 1997 the botanists Wilhelm Barthlott and Christoph Neinhuis published research on why lotus leaves stay clean: microscopic bumps covered in wax trap air, so water beads and rolls off, carrying dirt with it. They called it the lotus effect, and it led to self-cleaning paints and fabrics, including facade paint marketed from 1999. The two stories show a symbol and a mechanism pointing in the same direction, and they show how an observation from an Eastern cultural tradition became a working example of biomimicry.",
tao:"Taoism, also written Daoism, is a Chinese philosophy and religion centred on the Dao, the way or course of nature. Its foundational texts are the Tao Te Ching, attributed to Laozi and probably compiled around the fourth century BCE, and the writings of Zhuangzi, which use paradox and humour. Central ideas include wu wei, acting in harmony with things rather than forcing them, and the interplay of yin and yang. In contrast to the ordered ethics of Confucianism, Taoism values spontaneity and humility, and it shaped Chinese medicine, landscape painting, alchemy and poetry. Its ideas influenced twentieth-century Western thinkers, composers such as John Cage and Brian Eno, and ecological thought, as a different way to relate to nature.",
zen:"Zen is the Japanese form of Chan Buddhism, a Chinese tradition that emphasises direct experience through seated meditation, called zazen, instead of reliance on scripture. Legend says it was brought to China by Bodhidharma around the fifth or sixth century. In Japan, the monk Eisai introduced Rinzai Zen around 1191, and Dogen founded Soto Zen after 1227. Practitioners use koans, short paradoxical stories or questions, to unsettle ordinary thinking. Zen shaped tea ceremony, ink painting, gardens, calligraphy and martial arts. In the twentieth century D. T. Suzuki's writings brought it to the West, where John Cage studied it and lectured on it, and it fed into ideas of mindfulness, minimalism and chance in art and music.",
alex:"Alexander the Great, king of Macedon, conquered the Persian Empire within a decade and in 326 BCE defeated the Indian ruler Porus at the Battle of the Hydaspes in the Punjab. When his exhausted army refused to go further east, he turned back, and he died in Babylon in 323 BCE. His campaigns created a Hellenistic world where Greek language, art and ideas met Persian, Egyptian and Indian cultures, and founded cities such as Alexandria in Egypt, home of the great library. In Gandhara, Greek styles influenced Buddhist sculpture, including the first images of the Buddha in human form, and Greek kings in Bactria ruled alongside Indian traditions. Alexander is therefore a major link between Mediterranean and Asian cultures.",
sidd:"Siddhartha Gautama, later known as the Buddha, was born in Lumbini, in present-day Nepal, in the fifth century BCE or thereabouts, since scholars debate the dates. According to tradition he was a prince who left his palace after seeing old age, sickness and death, tried severe asceticism, and then attained awakening beneath a tree at Bodh Gaya. His first sermon at Sarnath set out the Four Noble Truths and the Eightfold Path, a middle way between indulgence and denial. He taught that suffering arises from craving, that all things are impermanent and that the self is not fixed. His movement was open to all classes and has spread across Asia, offering a non-theistic, practical philosophy.",
metta:"Metta is a Pali word usually translated as loving-kindness or goodwill, and it is one of four qualities, called the brahmaviharas, cultivated in Buddhist practice. The Metta Sutta, a discourse in the Pali Canon, describes wishing all beings to be happy and free from harm. In the common modern practice, a person silently repeats phrases such as may you be well, directing them first to themselves, then to a loved one, a neutral person, a difficult person and finally all beings. Studies of compassion training suggest benefits for wellbeing and social connection, though results vary. Metta shows how a contemplative tradition treats emotion as a skill that can be trained, which contrasts with views of feelings as fixed.",
pali:"The Pali Canon, or Tipitaka, is the scripture of the Theravada school of Buddhism, divided into three baskets: the Vinaya on monastic discipline, the Suttas, or discourses attributed to the Buddha and his disciples, and the Abhidhamma, a systematic analysis of mind and phenomena. For several centuries the texts were memorised and recited by communities of monks, and they were first written down in Sri Lanka around the first century BCE, traditionally under King Vattagamani. Pali, a language related to Sanskrit, remains the liturgical language in Sri Lanka, Myanmar and Thailand. Other canons, in Chinese and Tibetan, preserve parallel texts. The Pali Canon shows how a tradition can transmit complex teachings orally and then adapt to writing.",
fut:"Futurism was launched by the Italian poet Filippo Tommaso Marinetti, whose manifesto was published on the front page of Le Figaro on 20 February 1909. It celebrated speed, machines, cities and violence, called for the destruction of museums and libraries, and declared a racing car more beautiful than classical sculpture. Painters such as Umberto Boccioni and Giacomo Balla tried to capture motion, and Luigi Russolo's Art of Noises of 1913 proposed that the sounds of industry should become music. Marinetti later allied with Mussolini's fascism, while Russian Futurists such as Vladimir Mayakovsky supported the revolution. Futurism shows how enthusiasm for technology could be enlisted by very different political movements.",
lunach:"Anatoly Lunacharsky was the first Soviet People's Commissar for Enlightenment, in charge of education and culture from the revolution of 1917 until 1929. A writer and critic, he tried to protect museums and historic buildings, supported literacy campaigns and sponsored both avant-garde artists and traditional forms, often against pressure from more radical groups such as Proletkult. Under him, artists designed posters, festivals and agitprop trains, and the state became the major patron of art. His tolerance eventually fell out of favour as Stalin consolidated power, and he was removed in 1929, dying in 1933 while on his way to serve as ambassador to Spain. His career shows how art can flourish and be constrained under state sponsorship.",
lis:"El Lissitzky was a Russian-Jewish artist, architect and designer born in 1890. In 1919 he made the poster Beat the Whites with the Red Wedge, in which geometric shapes stand for political forces. Working with Kazimir Malevich in Vitebsk, he developed Proun, a term for his abstract constructions that he described as a station between painting and architecture. He designed the typography of Mayakovsky's For the Voice in 1923, created pioneering exhibition spaces and photomontages, and designed the Soviet pavilion at the Pressa exhibition in Cologne in 1928. Suffering from tuberculosis, he died in 1941. Lissitzky connects abstract art, graphic design, architecture and propaganda, and his work influenced the Bauhaus and De Stijl.",
gabo:"Naum Gabo, born Naum Pevsner in 1890, was a Russian sculptor who helped define Constructivism. His Kinetic Sculpture, or Standing Wave of 1919 and 1920, used a vibrating rod to create the illusion of a solid form. In 1920, with his brother Antoine Pevsner, he published the Realistic Manifesto, which argued for kinetic rhythms, space and time as the basic elements of sculpture and rejected both Cubism and Futurism. He opposed the demand that art should be purely useful, so he came into conflict with Vladimir Tatlin and the productivists. He left Russia in 1922 and worked in Berlin, Britain and the United States, producing transparent sculptures in plastic and wire that reflect his interest in science.",
tat:"Vladimir Tatlin's Monument to the Third International, designed in 1919 and 1920, was meant to be a headquarters for the Communist International in Petrograd. Planned at about four hundred metres, taller than the Eiffel Tower, it consisted of a double spiral of iron and glass leaning at an angle, enclosing rotating volumes: a cube that would turn once a year, a pyramid once a month, a cylinder once a day and a hemisphere hourly. It was never built, as the materials and technology were not available and Russia was in civil war, but a large wooden model was exhibited in 1920. The tower became an icon of Constructivism, combining engineering, symbolism and a vision of architecture in motion.",
agit:"Agitprop, short for agitation and propaganda, was the system of political communication created by the Bolsheviks after 1917. Because a large part of the population could not read, messages were delivered through posters, street theatre, mobile agit-trains and ships fitted with printing presses and film projectors, and Vladimir Mayakovsky's stencilled ROSTA windows turned news into rhymed cartoons. Filmmakers such as Dziga Vertov took cameras to the countryside. Agitprop aimed to educate and mobilise, but also to control public opinion. The term has since been used for any art or campaign designed to persuade. It illustrates how new media, from cheap print to film, were used to build a political culture within a few years.",
rev:"Constructivism emerged in Russia around 1921, drawing on the work of Vladimir Tatlin and the debates after the revolution. The First Working Group of Constructivists, including Alexander Rodchenko, Varvara Stepanova and Lyubov Popova, rejected art for its own sake and argued that artists should become engineers of everyday life, making posters, textiles, furniture, theatre sets and architecture. They stressed materials, construction and function, using geometric forms and bold typography. The idea of production art put them at odds with abstract artists such as Naum Gabo, and by the late 1920s state demands for more conventional art reduced their influence. Constructivism nevertheless influenced the Bauhaus, De Stijl and graphic design worldwide.",
mussol:"Benito Mussolini became prime minister of Italy after the March on Rome in October 1922 and built a dictatorship that made extensive use of art and media. The state film institute LUCE, founded in 1924, produced newsreels, radio was nationalised, and architecture, such as Giuseppe Terragni's Casa del Fascio in Como (1936), expressed the regime's ambitions. Futurists, including Marinetti, supported the movement, though fascist taste was often more drawn to classical imagery and the cult of the leader. Mass rallies, uniforms and slogans created a politics of spectacle. A Ministry of Popular Culture was established in 1937. Italian fascism is a case study in how a modern state uses cinema, architecture and propaganda to shape identity.",
rodch:"Alexander Rodchenko was a leading Russian Constructivist who worked as a painter, designer and photographer. In 1921 he exhibited three monochrome canvases in red, yellow and blue, which he declared the end of painting. He then turned to designing posters, book covers and advertising, notably with the poet Mayakovsky in 1924, including the poster urging people to read books. His photographs used steep angles and diagonals to make viewers see the world afresh. In the Stalin period he faced criticism as a formalist and was later assigned to photograph state projects such as the White Sea Canal. Rodchenko links avant-garde art, industry, photography and political persuasion, and shows how artists adapt under changing regimes.",
stal:"Socialist realism was declared the official style of Soviet art at the first Congress of Soviet Writers in 1934, a policy promoted by Maxim Gorky and Andrei Zhdanov. It required art to be realistic in form and socialist in content, which in practice meant optimistic, readable scenes of heroic workers, farmers and leaders. Vera Mukhina's sculpture Worker and Kolkhoz Woman, shown at the 1937 Paris Expo, is a famous example. The doctrine ended the experimental freedom of the 1920s: Constructivists and other avant-gardists lost commissions, some were arrested, and many fell silent. Similar rules were later adopted in China and Eastern Europe, and the style raises the question of how states use accessibility and emotion as tools of control.",
speer:"Albert Speer was Adolf Hitler's favoured architect and a leading figure in Nazi cultural policy. He designed the Zeppelin Field in Nuremberg and the Cathedral of Light for the Nazi Party rallies of the 1930s, in which anti-aircraft searchlights created a wall of vertical beams, and the German pavilion at the Paris Expo of 1937. His plans for Germania, a monumental rebuilt Berlin, were never completed. He promoted a theory that buildings should be designed to leave impressive ruins. In 1942 he became Minister of Armaments, using forced labour, and at Nuremberg in 1946 he was sentenced to twenty years. His case shows how architecture can serve political theatre, and how a man can present himself afterwards as merely an artist.",
deg:"The Degenerate Art exhibition opened in Munich in July 1937, showing about 650 works by modernists including Wassily Kandinsky, Paul Klee, Emil Nolde, Max Beckmann and Ernst Ludwig Kirchner, confiscated from German museums. The pictures were hung crowded and askew, with insulting labels, in order to mock them as sick or un-German. It drew over two million visitors, more than the Great German Art Exhibition of approved work that opened nearby. Altogether the Nazis seized thousands of works from museums, selling some at a Lucerne auction in 1939 and destroying others. The exhibition illustrates how the regime used art to promote ideas of racial purity, and it pushed many artists into exile, which spread modernism abroad.",
mao:"The Cultural Revolution, launched by Mao Zedong in 1966 and lasting until his death in 1976, was a campaign to purge perceived bourgeois and traditional elements from Chinese society. Students formed Red Guard groups, attacked teachers and officials, and set out to destroy the so-called Four Olds: old ideas, culture, habits and customs. Temples, books and artworks were destroyed, and millions were persecuted, imprisoned or killed. Culture was tightly controlled: instead of traditional opera, audiences were given eight approved model works, and posters of Mao were produced in huge numbers. Universities closed for years. The period shows the extreme consequences of making art a tool of political purity, and it left deep scars on Chinese cultural life.",
teleo:"Teleology is the idea that things are explained by their purposes or goals, not only by their causes. Aristotle made it central to his science with the notion of final cause: an acorn develops because its end is to be an oak. Thomas Aquinas, writing in the 1260s and 1270s, adapted this view in his Five Ways, arguing that the apparent purpose of natural things points to an intelligent designer. Medieval and Renaissance thinkers therefore saw nature as a ranked order in which everything served a higher end, ultimately humans and God. Early modern science, from Galileo and Newton, set purposes aside in favour of mechanical causes, and Darwin showed that apparent design can arise from selection. The debate over purpose in nature continues in ecology and Gaia theory.",
vitru:"Leonardo da Vinci's Vitruvian Man, drawn around 1490, shows a male figure inscribed in both a circle and a square, with arms and legs in two positions. It illustrates a passage by the Roman architect Vitruvius, who argued in De architectura that a well-designed building should follow the proportions of the human body. Leonardo corrected the text by measuring real bodies, so the drawing joins ancient authority to observation. It became an icon of Renaissance humanism, the belief that humanity is the measure of things, and of the link between art, geometry and anatomy. It also reveals the limits of the ideal: the figure is a single idealised male body, which later architects such as Le Corbusier and critics have questioned.",
chart:"The Renaissance chart of order, often called the Great Chain of Being, pictured the universe as a ladder running from God through angels, humans, animals and plants down to minerals, with every creature holding a fixed place. The image appears in works such as Diego Valadés's Rhetorica Christiana of 1579, and the historian Arthur Lovejoy traced the idea in his 1936 book The Great Chain of Being. It gave a sense of cosmic harmony, but it also justified social hierarchy, by placing kings above commoners, men above women and Europeans above other peoples. Evolutionary biology replaced the ladder with a branching tree, and ecology with webs of relationships. The chart is a vivid example of how a picture of nature can support a picture of society.",
neo:"Neoclassicism was an art and architecture movement of the mid-eighteenth to early nineteenth century that revived the forms of ancient Greece and Rome. It was fuelled by excavations at Herculaneum and Pompeii, begun in 1738 and 1748, and by Johann Joachim Winckelmann's 1764 History of the Art of Antiquity, which praised noble simplicity and calm grandeur. Painters such as Jacques-Louis David, in The Oath of the Horatii of 1784, used clear lines and moral themes, which suited the Enlightenment and the French and American revolutions. Public buildings in Washington, D.C., Paris and London adopted columns and pediments. The style stresses reason, order and proportion, ideas that go back to Euclid, and it was later criticised for coldness and for tying power to antiquity.",
phren:"Phrenology was founded by the Viennese physician Franz Joseph Gall around 1796 and popularised by Johann Spurzheim. It claimed that the mind is made of separate faculties, such as benevolence or cautiousness, each located in a part of the brain, and that the shape of the skull reveals how developed each one is. Phrenologists measured heads, made plaster casts and gave public readings, and the practice was wildly popular in the early nineteenth century. It has since been discredited, and it was used to support racial hierarchies and colonial attitudes. However, its insistence that different brain regions perform different functions anticipated later neuroscience. Phrenology is a cautionary example of how measurement can give prejudice an air of scientific authority.",
empire:"The civilising mission was the belief, common among nineteenth-century European powers, that colonised peoples should be educated and improved according to European standards. The French spoke of a mission civilisatrice, while Britain's Rudyard Kipling urged Americans in 1899 to take up the White Man's Burden. The idea gained force around the Berlin Conference of 1884 and 1885, when European states divided Africa among themselves. Missionaries, schools, railways and legal systems were presented as gifts, yet they served to extract resources and labour and to justify violence. The doctrine rested on the hierarchy of civilisations found in the old chain of being and in phrenology and race science. Postcolonial writers have since criticised it as a mask for domination.",
prop:"The word propaganda comes from Propaganda Fide, the Catholic Church's congregation for spreading the faith, founded in 1622. In the twentieth century it came to mean systematic mass persuasion, developed during the First World War and refined by commercial publicists such as Edward Bernays. After taking power in 1933, the Nazis established the Reich Ministry of Public Enlightenment and Propaganda under Joseph Goebbels, using radio, cheap Volksempfänger receivers, rallies and films such as Triumph of the Will in 1935. Techniques included simple slogans, repetition, emotional images and the creation of enemies. Democracies and the Soviet Union also used propaganda. Studying it connects media history, social psychology and art, and teaches critical habits for judging how images and messages are designed to move us.",
clark:"Civilisation, a thirteen-part BBC television series presented by the art historian Kenneth Clark in 1969, offered a personal view of Western European art and thought from the Dark Ages to the twentieth century. It was one of the first major television series made in colour and attracted a large audience. Clark's thesis was that civilisation rests on confidence, creativity and respect for human dignity, illustrated by cathedrals, painters and philosophers. Critics noted that it treated Europe as the centre of the world and said little about other cultures or the people who built the monuments, and John Berger's Ways of Seeing in 1972 was an explicit response. The series is a good example of a story told as a chain of great men and masterpieces.",
hughes:"The Shock of the New, an eight-part BBC series presented by the Australian critic Robert Hughes in 1980, surveyed modern art from the 1880s to the 1970s, and was published as a book the same year. Hughes combined vivid writing and location filming to explain movements such as Cubism, Futurism, Constructivism, Surrealism and Pop, linking them to technology, politics and the city. He was admiring of the early modernists' ambition but critical of how the art market and fashion had turned modernism into commodity. The series is often paired with Kenneth Clark's Civilisation as a modern answer, though it also centred on Europe and America. It remains a lively overview of how machines and new media changed what artists wanted to do.",
ind:"Industrial schooling is the idea that modern mass education took on features of the factory: children grouped by age, moved by bells through standardised lessons, and assessed against fixed standards. Its roots lie in the Prussian system, with compulsory elementary schooling introduced in the early nineteenth century, and in reformers such as Horace Mann, who promoted common schools in Massachusetts from 1837. Supporters point to the benefits of universal literacy, punctuality and equal access. Critics, including John Dewey and later Ken Robinson, argue that the model suits an industrial economy, favours conformity and neglects creativity and individual pace. Historians caution that the factory comparison is simplified. The debate matters for how schools respond to automation and AI.",
headbody:"Head over body describes a long habit in education of valuing abstract thinking above physical and practical skill. It draws on a tradition running from Plato to René Descartes, whose Meditations of 1641 separated mind from body. In schools it shows in students sitting still for hours, in the high status of mathematics and languages, and in the low priority of physical education, dance and craft. Research on embodied cognition suggests that learning is deeply connected to movement, gesture and making, and educators such as Maria Montessori built methods around hands-on activity. The theme links to the hierarchy of subjects, to arts education and to the Bauhaus workshops, where thinking and making were deliberately joined.",
robin:"Sir Ken Robinson was a British education expert whose 2006 talk Do Schools Kill Creativity?, given at the TED conference, became one of the most watched talks of all time. He argued that schools around the world rank subjects in a hierarchy, with mathematics and languages at the top, humanities in the middle and the arts at the bottom, reflecting the needs of industrialism. He chaired the 1999 British report All Our Futures on creative and cultural education and wrote books such as Out of Our Minds. He called for education that values diverse talents and imagination. Critics say he offered few concrete solutions and underrated the importance of knowledge. He died in 2020, and his ideas remain a touchstone for arts education.",
breadth:"Breadth subjects are courses that students take outside their main field of study, intended to broaden their education. The idea resembles the general education requirements of American liberal arts colleges, and Australian universities adopted versions in the 2000s, such as the University of Melbourne's curriculum reform of 2008, which required undergraduates to take subjects from other disciplines. Supporters say breadth prepares graduates to work across fields, think critically and connect ideas, and that innovation often happens at the boundaries between disciplines. Critics worry that it dilutes depth or adds costs, and students sometimes treat breadth subjects as unconnected extras. In this map it suggests an alternative to the neatly divided curriculum inherited from industrial schooling.",
vca:"The Victorian College of the Arts is the art school of the University of Melbourne, covering visual art, music, dance, theatre and film, and its Centre for Ideas is a program that hosts public talks, exhibitions, residencies and research connecting art with wider questions in culture and society. Such centres work as places where students and the public meet artists, theorists and scientists outside the structure of a standard course. They reflect a view of arts education in which ideas are developed through discussion and practice together, and where different disciplines are brought into the same room. In the context of this map it represents an example of the collaborative, cross-disciplinary approach contrasted with the siloed model of older schooling.",
collab:"Collaboration in education means learning and creating together instead of alone. Lev Vygotsky's work in the 1930s argued that learning happens through social interaction, within a zone of proximal development where a learner can do with help what they cannot yet do alone. Later researchers such as David and Roger Johnson developed cooperative learning methods, and Etienne Wenger described communities of practice, in which people learn by participating in shared work. Effective collaboration needs clear roles, trust and fair assessment, since group projects can lead to unequal effort or social loafing. In the arts, the Bauhaus, film crews and orchestras show the creative power of joint work. Collaboration challenges the idea that knowledge is a private possession measured by individual exams.",
journal:"A learning journal is a regular written record in which students reflect on what they have done, thought and learned. It draws on John Dewey's 1910 book How We Think, which treated reflection as the key to learning from experience, and on Donald Schön's The Reflective Practitioner of 1983. Models such as David Kolb's experiential learning cycle of 1984 and Graham Gibbs's reflective cycle of 1988 give structure by prompting description, feelings, evaluation and planning. Journals encourage metacognition, the habit of thinking about one's own thinking, and are common in art, design and professional courses. They echo the sketchbooks and notebooks of artists such as Leonardo, and they offer a way of assessing process and growth rather than only final products.",
camobs:"The camera obscura, Latin for dark room, is an enclosed space or box in which light passing through a tiny hole projects an inverted image of the outside onto the opposite surface. Chinese philosopher Mozi described the effect in the fifth century BCE, and the Arab scientist Ibn al-Haytham, known as Alhazen, analysed it in his Book of Optics around 1021, using it to argue that vision depends on light entering the eye. Johannes Kepler gave the device its name in 1604. Renaissance artists used it to study perspective, and later versions led directly to photography. The camera obscura is a reminder that the eye works like a lens system, and that the brain, not the eye, makes sense of what it receives.",
learned:"Learned consonance is the idea that what sounds pleasant or unpleasant in music is shaped partly by exposure and culture, not entirely by acoustics. Theorists from Rameau to Helmholtz explained consonance by simple frequency ratios and shared harmonics, but cross-cultural research complicates the picture. A 2016 study in Nature by Josh McDermott and colleagues, working with the Tsimane people of the Bolivian Amazon, found little preference for consonant over dissonant chords, suggesting that the Western preference grows from familiarity. Historical changes support this: intervals once avoided later became standard, as in the acceptance of thirds in medieval Europe. The question connects tuning systems, perception and culture, and asks whether any musical standard is natural or learned.",
phantom:"Phantom limb pain is the sensation, often painful, that a missing arm or leg is still present. The American physician Silas Weir Mitchell coined the term in 1871 after treating amputees from the Civil War. For many decades, explanations focused on irritated nerves in the stump, but later research suggested that the brain's body map reorganises after loss, so neighbouring areas take over the region that once represented the limb. V. S. Ramachandran developed the mirror box in the 1990s, which uses the reflection of the intact limb to trick the brain and relieve pain in some patients. The phenomenon shows that the body is partly a construction of the brain, and it is a key example of neuroplasticity and conflicting senses.",
illus:"Optical illusions reveal how the brain constructs what we see. The Necker cube, described in 1832, flips between two three-dimensional readings, the Müller-Lyer illusion of 1889 makes equal lines appear unequal, and Adelbert Ames's distorted room of 1946 makes people seem to grow or shrink. Hermann von Helmholtz suggested that perception involves unconscious inference, with the brain guessing the most likely cause of the signals reaching the eye, while Gestalt psychologists emphasised the role of organised wholes. Artists from Renaissance painters to Op Art creators such as Bridget Riley exploit these effects. Illusions show that seeing is an active interpretation influenced by context and expectation, which undermines the idea that the senses are simple recording devices.",
listen:"Hearing is the passive physical process by which sound reaches the ear, while listening is the active focus of attention on what is heard. The distinction is central to twentieth-century sound art. Pierre Schaeffer proposed reduced listening, attending to the qualities of a sound itself, such as texture and shape, instead of its source. John Cage invited audiences to listen to everyday noise, and R. Murray Schafer described the soundscape as something to be listened to critically. In 1989 Pauline Oliveros recorded in a large cistern and developed Deep Listening, a practice of attending to all sounds, including those inside the mind. Learning to listen is a skill with social, environmental and artistic value, and it links music to mindfulness and ecology.",
conflict:"Conflicting senses occur when information from different senses disagrees, and the brain resolves the conflict by blending or favouring one. In the McGurk effect, discovered in 1976, seeing a mouth form ga while hearing ba leads many people to perceive da. In the ventriloquist effect, voices seem to come from a moving dummy because vision dominates our sense of location, and in the rubber hand illusion of 1998 by Matthew Botvinick and Jonathan Cohen, brushing a hidden real hand and a visible fake one in sync makes the fake feel like part of the body. These experiments show that perception combines sources, usually vision first, and that our sense of self is flexible, which complicates models of mind based on separate senses.",
synaes:"Synaesthesia is a condition in which stimulation of one sense triggers another, so a person may see colours when hearing music or associate letters with fixed colours. Francis Galton described it in a 1880 article in Nature, and surveys suggest that around four per cent of people experience some form. It tends to run in families and is consistent over time for a given person, which distinguishes it from metaphor. Artists and composers reported to have it include Wassily Kandinsky, Olivier Messiaen and Vladimir Nabokov, and Alexander Scriabin linked keys to colours. Researchers such as V. S. Ramachandran have suggested cross-activation between neighbouring brain areas. Synaesthesia challenges the idea of strictly separate senses and inspired colour music and abstract art.",
exch:"Knowledge has long flowed in both directions between civilisations, yet later histories often erase the exchange. From 1583 Jesuit missionaries such as Matteo Ricci reached China, where Ricci and the scholar Xu Guangqi translated the first books of Euclid's Elements into Chinese in 1607, and later Jesuits worked as astronomers at the imperial court. In the other direction, Indian scholars and physicians travelled to Persian and Greek-speaking courts, and Indian astronomy and numerals reached the Islamic world and then Europe. Because each side often told the story as a one-way gift of civilisation, credit became concentrated in a single tradition. Recovering the exchange shows that science and art were co-produced by networks of translators, merchants and travellers.",
histhist:"The history of history, or historiography, asks how accounts of the past are shaped by the people who write them. In the nineteenth century, Leopold von Ranke urged historians to show the past as it actually was, while Hegel's lectures presented history as the progress of freedom culminating in Europe, and Marx added a political economy of class and production. These frameworks tended to treat Europe as the engine of change and other regions as static. Later scholars, from Edward Said to the Subaltern Studies group, and Joseph Needham's massive Science and Civilisation in China from 1954, challenged this Eurocentric framing. Studying how history is written reveals why some inventors, regions and peoples are celebrated while others are ignored.",
bodytech:"Technology is not separate from the body, culture or art. The anthropologist Marcel Mauss argued in his 1934 essay Techniques of the Body that walking, swimming, sleeping and giving birth are learned skills that differ between societies. Instruments extend this: a violin, a pen or a keyboard becomes an extension of the hands and ears, and Marshall McLuhan described media as extensions of the senses. Donna Haraway's Cyborg Manifesto of 1985 went further, arguing that people are already hybrids of organism and machine. Dance, voice and craft show the point, because skill resides in the practised body. The idea challenges the story of technology as external tools and links music, design and the history of media.",
phono:"Thomas Edison announced the phonograph in 1877, recording sound by making a stylus trace vibrations on tinfoil wrapped around a cylinder, and demonstrating it by playing back Mary Had a Little Lamb. Earlier, in 1857, Édouard-Léon Scott's phonautograph had traced sound waves on paper, but it could not play them back. Emile Berliner's flat disc gramophone of 1887 proved easier to copy and eventually dominated. For the first time a performance could be stored and repeated, which turned music into a product sold in records and made stars such as Enrico Caruso famous worldwide. Recording changed how people listened, how musicians played and, later, how composers used tape and samples.",
church:"Placing a plane in a church captures the early twentieth-century habit of treating technology as a kind of faith. At Paris's Musée des Arts et Métiers, housed in a former priory church, early aircraft such as Blériot's monoplane hang in the nave, where worshippers once looked up. Henry Adams had already expressed the mood in 1900, after seeing the dynamo at the Paris Exposition, in The Virgin and the Dynamo, comparing the electrical machine to the medieval cult of the Virgin as a source of force. Futurists, engineers and advertisers adopted religious language for speed and progress. The image links flight, world's fairs and Gothic cathedrals, and invites questions about what societies treat as sacred.",
manif:"The years from about 1910 to 1930 produced an extraordinary number of manifestos, short declarations announcing a new way of making art. Marinetti's Futurist manifesto of 1909 set the tone, followed by Dada's in 1916 to 1918, De Stijl in 1918, the Bauhaus programme of 1919, the Constructivist Realistic Manifesto of 1920, Le Corbusier's Vers une architecture in 1923 and André Breton's Surrealist manifesto in 1924. Many were written in reaction to the First World War, to rapid technological change and to political revolution. They share an urge to break with the past and redesign everyday life, and many ideas of the twentieth century, from functional design to chance and montage, took shape in this period, which is why it serves as a template.",
moon:"Earthrise, photographed by astronaut William Anders from Apollo 8 on 24 December 1968, showed the Earth as a small, fragile sphere above the lunar horizon. In 1972 the crew of Apollo 17 took the Blue Marble photograph of the whole planet. The activist Stewart Brand had campaigned for such an image, and used it on the cover of the Whole Earth Catalog. The pictures fed the first Earth Day in 1970, and Buckminster Fuller's Spaceship Earth and James Lovelock's Gaia hypothesis gained a visual symbol. Seeing the Earth as a single system with no visible borders shifted public thinking about environment and unity, and it is among the most influential images produced by technology.",
fairs:"World's fairs were large international exhibitions that displayed industrial progress and national prestige. The first, the Great Exhibition of 1851 in London, was housed in Joseph Paxton's glass-and-iron Crystal Palace and drew about six million visitors. Later fairs in Paris, Chicago and elsewhere introduced the Eiffel Tower in 1889, the Ferris wheel in 1893 and many machines and products. They also displayed colonial peoples in staged villages, reinforcing racial hierarchies, and exposed Western artists to non-Western art and music, such as the Javanese gamelan heard by Claude Debussy in Paris in 1889. The fairs mixed science, commerce, entertainment and empire, and they show how technology was marketed to the public as a promise of progress.",
bulb:"The practical incandescent light bulb emerged between 1878 and 1880, when Joseph Swan in Britain and Thomas Edison in the United States developed lamps with carbon filaments that could burn for hours in a vacuum. Many earlier inventors had contributed, and Edison's success owed much to teamwork at his Menlo Park laboratory and to building a whole system of generators, wiring and meters, the first of which, Pearl Street Station in New York, opened in 1882. Electric light replaced whale oil and gas, extended the working day and changed city life, entertainment and architecture. The later victory of alternating current, championed by Westinghouse and Nikola Tesla, enabled long-distance distribution and made electricity a utility.",
mach:"The idea of the universe as a giant machine, which came from Newton and the clockwork tradition, began to fade in the early twentieth century. Relativity showed that time and space are not absolute, quantum mechanics in the 1920s introduced probabilities and uncertainty, and Gödel's theorems of 1931 showed limits to formal proof. Later, chaos theory demonstrated that even deterministic systems can be unpredictable. Biology moved from mechanism towards ecological and evolutionary systems, and thermodynamics emphasised irreversible processes. Newton's laws remain extremely useful in engineering, but the picture of a predictable machine gave way to a world of processes, relationships and chance. This shift links the science of the period to modern art, philosophy and ecology.",
lorenz:"In 1961 the meteorologist Edward Lorenz at MIT re-ran a computer weather simulation, entering a number rounded from 0.506127 to 0.506, and found that the result diverged completely from the earlier run. His 1963 paper Deterministic Nonperiodic Flow described this sensitive dependence on initial conditions, later popularised as the butterfly effect after a 1972 talk. Earlier, Henri Poincaré had glimpsed similar behaviour in the three-body problem in the 1890s. Chaos theory showed that deterministic systems can be unpredictable in practice, which set limits on long-range forecasting, and it gave rise to the study of strange attractors and, with Mandelbrot, fractals. It ended the hope of a perfectly predictable clockwork universe.",
glob:"Globalisation refers to the increasing connection of economies, cultures and people across the world. The fall of the Berlin Wall in 1989, the launch of the World Wide Web in 1991 and the creation of the World Trade Organization in 1995 marked a rapid acceleration, building on earlier steps such as the shipping container of the 1950s and the telegraph. Goods, money, ideas and music now cross borders quickly, and cultural forms blend, as in world music and hip-hop. Supporters point to rising incomes and shared knowledge, while critics highlight inequality, loss of local culture and environmental cost. Globalisation is a modern continuation of exchanges that began along the Silk Road, and it shapes debates about education, media and the economy.",
plant:"Rewriting the chart means revising the old ladder of nature, in which humans stood above animals and animals above plants. Researchers such as Stefano Mancuso argue that plants sense, signal and respond in sophisticated ways, though the label plant intelligence is contested. Suzanne Simard's work on forests suggests that trees exchange carbon through fungal networks. In ethics, Peter Singer's Animal Liberation of 1975 argued that animal suffering deserves moral consideration, and in 2012 a group of neuroscientists signed the Cambridge Declaration on Consciousness, recognising that many animals have the neurological substrates of conscious experience. These developments question the hierarchy of the Renaissance chart and suggest a view of life as a web, not a ladder.",
ai:"Artificial intelligence began as a research field at the Dartmouth workshop in 1956, and for decades it alternated between hype and disappointment. Progress accelerated with deep learning after 2012, and in 2020 systems such as the language model GPT-3 and DeepMind's AlphaFold, which predicts protein structures, showed striking capabilities. Image and music generators followed, raising questions about creativity, authorship and the use of artists' work in training. Concerns also include bias, energy use, jobs and misinformation. The debate echoes Ada Lovelace's remark that machines only do what they are instructed to do, and Turing's question of whether machines can think. For education and the arts, AI is both a tool and a challenge to the idea of what is uniquely human.",
persp:"Linear perspective is a system for representing three-dimensional space on a flat surface so that parallel lines meet at a vanishing point. Filippo Brunelleschi is credited with demonstrating it in Florence around 1415, using a painted panel viewed through a hole and a mirror. Leon Battista Alberti described the method in his 1435 treatise On Painting, treating the picture as a window. The method drew on medieval optics, especially Ibn al-Haytham's work, and it shaped Renaissance painting, architecture and stage design. It assumes a single, fixed eye, which is not how people actually see, and Erwin Panofsky called it a symbolic form. Cubists later rejected it, and photography, with its lens, inherited many of its conventions.",
impress:"Impressionism takes its name from an 1874 exhibition in Paris, organised by a group of artists including Claude Monet, Camille Pissarro and Pierre-Auguste Renoir, where a critic mocked Monet's Impression, Sunrise. The painters worked outdoors in quick, visible brushstrokes to capture fleeting light and atmosphere. Their methods depended on new technology: paints sold in portable metal tubes from the 1840s, railways that brought painters to the countryside and cities under reconstruction. Photography freed painting from exact documentation, and Japanese prints and theories of colour by Michel Eugène Chevreul influenced their palette. Impressionism moved attention from subject matter to perception itself, which opened the road to abstraction, and it shows how science and technology reshaped art.",
cubism:"Cubism was developed by Pablo Picasso and Georges Braque in Paris from about 1907, the year of Picasso's Les Demoiselles d'Avignon, and its name came from a critic's remark in 1908. In its analytic phase, around 1909 to 1912, objects are broken into facets and shown from several viewpoints at once, in subdued colours. Synthetic Cubism then introduced collage with newspaper and wallpaper. The painters were influenced by Paul Cézanne and by African and Oceanic sculpture, which they and others often took out of context. Cubism rejected single-point perspective and treated a picture as a constructed object, an approach that influenced Futurism, Constructivism, architecture and design, and which resonated with the new ideas about time and space in physics.",
kand:"Wassily Kandinsky, a Russian painter who worked mostly in Germany, is widely credited as a pioneer of abstract art. His book Concerning the Spiritual in Art, published in 1911, argued that colour and form can affect the soul directly, like music, and he gave his paintings musical titles such as Improvisation and Composition. In 1911 he co-founded the Blaue Reiter group with Franz Marc. He was interested in Theosophy and may have experienced synaesthesia, linking sounds and colours. He taught at the Bauhaus from 1922 until it closed in 1933. Kandinsky links painting and music, spirituality and geometry, and shows how abstraction was a serious attempt to express inner experience.",
duchamp:"In 1917 Marcel Duchamp submitted a porcelain urinal, signed R. Mutt and titled Fountain, to the exhibition of the Society of Independent Artists in New York. The board rejected it, though the exhibition was supposed to accept all entries, and the original was lost after being photographed by Alfred Stieglitz. Fountain belonged to his readymades, ordinary manufactured objects chosen and presented as art, which began with a bicycle wheel in 1913. The work argued that an idea and a choice, rather than craft, can make art, and a 2004 poll of art experts named it the most influential artwork of the twentieth century. Some scholars suggest that Elsa von Freytag-Loringhoven played a role. Duchamp's gesture anticipated Pop art and conceptual art.",
surreal:"Surrealism was launched by André Breton's manifesto of 1924, which defined it as pure psychic automatism, an attempt to express the real functioning of thought without reason's control. Influenced by Freud and by Dada, its artists explored dreams, chance and the unconscious. Painters such as Salvador Dalí, René Magritte and Max Ernst created strange, dreamlike scenes, while Ernst developed frottage, taking rubbings from textured surfaces. The film Un Chien Andalou, made by Luis Buñuel and Dalí in 1929, took the approach to cinema. Many Surrealists were politically engaged with Communism and anticolonial causes. The movement's use of chance and the irrational influenced later artists, including John Cage and Brian Eno, and challenged the machine-age emphasis on order.",
writing:"Writing appears to have been invented independently several times. The earliest known system is Sumerian cuneiform, which developed in Uruk around 3200 BCE from clay tokens used for accounting, and Egyptian hieroglyphs appeared at about the same time. Chinese writing is attested on oracle bones from around 1250 BCE, and Mesoamerican scripts developed separately. Early writing was used for administration, taxation and religious texts, and only later for literature, as in the poems of Enheduanna, a Sumerian priestess. Writing allowed memory and information to be stored outside the mind and carried over distance and time. Plato worried in the Phaedrus that it would weaken memory. It is the base on which paper, printing and the internet were later built.",
alphabet:"Alphabets are writing systems in which signs stand for sounds instead of whole words. The earliest alphabetic script, Proto-Sinaitic, appeared in the Sinai and Egypt around 1800 BCE, adapted from hieroglyphs by Semitic-speaking workers, and the Phoenicians spread a simplified set of twenty-two consonant letters by about 1050 BCE. Greeks adapted it around the ninth or eighth century BCE, adding vowels, and the Latin, Cyrillic, Hebrew and Arabic alphabets descend from or are related to the same family. Because only a few dozen signs need to be learned, alphabets made literacy more accessible than complex scripts. They also suit movable type, which helped Gutenberg's press succeed in Europe, while Chinese printers needed thousands of different characters.",
telegraph:"The electric telegraph sent messages as coded pulses along wires. Samuel Morse's version, using a code of dots and dashes, carried the first public message from Washington to Baltimore in 1844, while William Cooke and Charles Wheatstone had patented a system in Britain in 1837. A transatlantic cable laid in 1858 failed after a few weeks, but a durable one succeeded in 1866. News agencies such as Reuters flourished, railways used the telegraph to coordinate, and markets, wars and diplomacy accelerated. It separated communication from transport for the first time, and the writer Tom Standage called it the Victorian internet. Telegraphy was also a form of digital coding, which links it to Boole, Shannon and modern computing.",
radio:"Radio grew from the discovery of electromagnetic waves by Hertz in 1887 and the wireless telegraph experiments of Guglielmo Marconi in the 1890s, who sent signals across the Atlantic in 1901. Reginald Fessenden transmitted voice and music in 1906. Regular broadcasting began around 1920, when station KDKA in Pittsburgh reported the American presidential election results, and the BBC started in 1922. Radio brought news, music and politics into homes simultaneously, and leaders used it to build a sense of national community, as in Franklin Roosevelt's fireside chats from 1933. It also carried propaganda, and Orson Welles's 1938 dramatisation of The War of the Worlds showed its power to convince. Radio shaped modern popular music and electronic experimentation.",
tv:"Television took shape in the 1920s and 1930s, with John Logie Baird demonstrating a mechanical system in 1926 and Philo Farnsworth working on an all-electronic version in 1927. The BBC began the world's first regular high-definition service on 2 November 1936 from Alexandra Palace in London. After the Second World War, television spread rapidly, and events such as the coronation of Elizabeth II in 1953 and the Moon landing in 1969, watched by hundreds of millions, created shared global experiences. Marshall McLuhan argued that television shifts culture towards immediacy and image. It also became the main vehicle for advertising, politics and documentaries such as Civilisation and The Shock of the New, and it prepared the way for online video.",
net:"The World Wide Web was proposed by Tim Berners-Lee at CERN in March 1989, with the first website launched in 1991. It combined hypertext, a web address system and a protocol called HTTP, running on the internet, which had grown from the US ARPANET of 1969 and adopted the TCP/IP standard in 1983. In 1993 CERN made the web technology free to use, and the Mosaic browser brought it to the public. The web made publishing and sharing possible for anyone, and it reshaped commerce, education, music and politics, while also enabling the attention economy and misinformation. Its structure of links connecting everything evokes Indra's net and the networks found in ecosystems, and it extends the history that began with writing and printing.",
newton:"Isaac Newton's Principia Mathematica, published in 1687, set out three laws of motion and the law of universal gravitation, showing that the same mathematics describes falling apples and orbiting planets. He developed calculus, and in his Opticks of 1704 he used a prism to show that white light is a mixture of colours. His work established the picture of a mechanical, predictable universe, often compared to a clock, which dominated European thought for two centuries. Newton also spent much time on alchemy and theology, which complicates the image of the pure rationalist. His laws still work for everyday engineering, but relativity and quantum theory later revealed their limits, so he symbolises both the power and the boundaries of the clockwork view.",
reduct:"Reductionism is the strategy of explaining complex things by breaking them into simpler parts. Descartes' Discourse on Method of 1637 recommended dividing every problem into as many parts as possible, and Laplace imagined in 1814 an intellect that, knowing all positions and forces, could predict the future. The approach has been extraordinarily successful, explaining matter by atoms, life by molecules and genes. Critics argue that some properties emerge only from the organisation of the whole, as the physicist Philip Anderson stated in his 1972 essay More Is Different, and that ecosystems, minds and cultures cannot be understood part by part. Reductionism is the intellectual backbone of the machine model, and its limits drive interest in complexity and ecology.",
qft:"Quantum field theory treats the basic ingredients of nature as fields that fill space, with particles as ripples or excitations in those fields. It was developed in the 1930s and 1940s, and in 1947 and 1948 Richard Feynman, Julian Schwinger and Sin-Itiro Tomonaga formulated quantum electrodynamics, explaining effects such as the Lamb shift, with Freeman Dyson showing that their approaches were equivalent. Its predictions of the electron's magnetic moment match experiments to many decimal places. It became the foundation of the Standard Model of particle physics, and the Higgs boson was discovered in 2012. Quantum fields replace the picture of tiny billiard balls, or Lego bricks, with a view of dynamic, probabilistic processes, and they mark the end of a strictly deterministic picture.",
chess:"Chess descends from chaturanga, a game that appeared in India by about the sixth century CE, with pieces representing the elements of an army. It passed to Persia as shatranj, was adopted across the Islamic world, and reached Europe through Spain and Italy by around 1000. In the late fifteenth century the rules changed so that the queen and bishop became powerful, creating the modern game. Its spread along trade and conquest routes parallels that of paper, numerals and music theory. In the twentieth century chess became a testing ground for artificial intelligence, from IBM's Deep Blue defeating Garry Kasparov in 1997 to AlphaZero, which taught itself in 2017. Chess is an example of how a cultural form can be passed between societies.",
gothic:"Gothic architecture emerged in northern France around 1140, when Abbot Suger rebuilt the abbey church of Saint-Denis with pointed arches, ribbed vaults and large windows. Flying buttresses, which carried the weight of the roof outwards, allowed walls to be thin and filled with stained glass, so that cathedrals such as Notre-Dame, begun in 1163, and Chartres, rebuilt after a fire in 1194, glowed with coloured light. Medieval thinkers saw light as an image of the divine. The cathedrals were built by guilds of masons and craftspeople over generations, which fascinated later reformers: Walter Gropius used Lyonel Feininger's woodcut of a cathedral on the 1919 Bauhaus manifesto, and Louis Sullivan admired the structural logic of Gothic design.",
tea:"Tea, made from the leaves of Camellia sinensis, was cultivated and drunk in China for centuries before it reached Europe. Buddhist monks carried the habit to Japan, where it evolved into the tea ceremony, which Zen and the master Sen no Rikyu shaped in the sixteenth century. Dutch traders brought the first shipments to Europe around 1610, and the British East India Company later made it a mass commodity. The trade drove the opium trade and the Opium Wars of 1839 to 1842 and 1856 to 1860, and in 1848 Robert Fortune smuggled plants and workers out of China to start plantations in India. Tea shows how a plant linked rituals, commerce, empire and global taste, and how trade networks shape cultures.",
